/* =====================================================================
   SLIDE CHESS — a folha de estilo.

   O tabuleiro herda do kit (kit/tabuleiro.css) o que já foi acertado lá:
   a casa medida em pixel inteiro pelo JS (`--casa`), o realce por cima da
   casa em pseudo-elemento, a bolinha de "pode ir" e a coordenada dentro
   da casa, na cor da casa oposta.

   O que é diferente: aqui as peças NÃO moram dentro das casas. Elas ficam
   numa camada por cima, posicionadas por `transform`, e por isso DESLIZAM
   de uma casa para a outra — que é o nome do jogo.

   AS DUAS CORES DO TABULEIRO SÃO DO MUNDO (`--escura` e `--clara`, ver
   mundos.js). Elas são escritas pelo JS em quem precisa delas — a tela
   do jogo, o cartão do mundo, a grelha de níveis — e o resto herda.
   ===================================================================== */

:root{
  --fundo:#12161f;
  --cartao:#1b2130;
  --cartao2:#232b3d;
  --linha:rgba(255,255,255,.10);
  --texto:#e9f1ff;
  --suave:#8a97b3;
  --destaque:#ffc43c;
  --escura:#769656;
  --clara:#eeeed2;
  --mono:ui-monospace,'JetBrains Mono',Consolas,monospace;
}

*{box-sizing:border-box}
html,body{height:100%}
/* NO TELEFONE: nada de zoom por toque duplo, de puxar a página para
   recarregar, nem de selecionar texto segurando o dedo — são gestos de
   site, e num jogo eles só acontecem por engano. */
html{touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
img{-webkit-user-drag:none}
body{margin:0;background:
    radial-gradient(1200px 600px at 50% -10%,#232c40 0,transparent 60%),var(--fundo);
  background-attachment:fixed;
  color:var(--texto);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent}

/* ----------------------------------------------------------- as telas
   Só uma aparece: a que o <body> nomeia em `data-tela`. */
/* `dvh` é a altura que SOBRA com a barra do navegador do telefone à vista;
   o `env()` afasta o conteúdo do entalhe e da barrinha de gestos. */
.tela{display:none;min-height:100%;min-height:100dvh;flex-direction:column;align-items:center;gap:14px;
  padding:max(14px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right))
          max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  animation:telaEntra .22s ease-out}
body[data-tela="inicio"] #telaInicio,
body[data-tela="mundos"] #telaMundos,
body[data-tela="niveis"] #telaNiveis,
body[data-tela="jogo"] #telaJogo,
body[data-tela="conquistas"] #telaConquistas,
body[data-tela="livre"] #telaLivre,
body[data-tela="aparencia"] #telaAparencia,
body[data-tela="estatisticas"] #telaEstatisticas{display:flex}
@keyframes telaEntra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

button{font:inherit;font-size:14px;font-weight:600;padding:9px 16px;border-radius:10px;cursor:pointer;
  color:var(--texto);background:var(--cartao);border:1px solid var(--linha);
  transition:border-color .15s,background .15s,transform .05s}
/* o realce de "passar o mouse" gruda depois do toque: só onde há mouse */
@media (hover:hover){button:hover:not(:disabled){border-color:var(--destaque)}}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button.principal{background:var(--destaque);border-color:var(--destaque);color:#201a05}
@media (hover:hover){button.principal:hover:not(:disabled){background:#ffd166}}
button:focus-visible{outline:2px solid var(--destaque);outline-offset:2px}

/* a barra de cima das telas de dentro */
.barra{width:100%;max-width:520px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.barra button{width:44px;height:44px;padding:0;font-size:19px;border-radius:12px}
.barra .voltar{font-size:28px;line-height:1;padding-bottom:4px}
.barra .titulo{text-align:center;min-width:0}
.barra .titulo b{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em}
.barra .titulo span{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--suave)}

.progresso{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden}
.progresso i{display:block;height:100%;border-radius:3px;background:var(--destaque)}

/* ============================================================ o início */
#telaInicio{justify-content:center;gap:10px;text-align:center}
.vitrine{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:84px}
.vitrine img{width:52px;height:52px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45));
  animation:vitrineBalanca 3.2s ease-in-out infinite}
.vitrine img:nth-child(2){animation-delay:-.6s}
.vitrine img:nth-child(4){animation-delay:-1.2s}
.vitrine img:nth-child(5){animation-delay:-1.8s}
.vitrine img.rainha{width:78px;height:78px;animation-delay:-2.4s;
  filter:drop-shadow(0 0 14px rgba(255,196,60,.8)) drop-shadow(0 6px 6px rgba(0,0,0,.45))}
@keyframes vitrineBalanca{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

.logo{margin:0;font-size:clamp(44px,13vw,68px);font-weight:900;letter-spacing:-.04em;line-height:1}
.logo span{color:var(--destaque);text-shadow:0 0 34px rgba(255,196,60,.35)}
.chamada{margin:2px 0 16px;color:var(--suave);font-size:15px}

.menu{display:flex;flex-direction:column;gap:9px;width:100%;max-width:360px}
.menu .par{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.menu .par button.grande{flex-direction:column;align-items:flex-start;gap:3px;padding:12px 14px}
.menu .par button.grande b{font-size:15.5px}
.menu .par button.grande small{font-size:11.5px}
/* o desafio do dia que ainda não foi feito chama, como o nível novo */
.menu button.chama{border-color:var(--destaque);animation:nivelChama 1.8s ease-in-out infinite}
.menu button.chama small{color:var(--destaque);opacity:1}
.atalhos{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:2px}
.atalhos button{flex:1 1 0;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 4px 7px;border-radius:12px}
.atalhos button span{font-size:19px;line-height:1}
.atalhos button small{font-size:10px;font-weight:600;color:var(--suave);white-space:nowrap}
.sequencia{margin:-8px 0 8px;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:700;
  color:#ffb37a;background:rgba(255,140,60,.12);border:1px solid rgba(255,140,60,.35)}
.sequencia[hidden]{display:none}
button.grande{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:15px 18px;border-radius:14px;text-align:left}
button.grande b{font-size:17px}
button.grande small{font-size:12px;font-weight:600;opacity:.75;white-space:nowrap}
button.grande.principal{padding:19px 18px;box-shadow:0 12px 30px -12px rgba(255,196,60,.7)}
button.grande.principal b{font-size:21px}

.rodape{margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:10px;
  font-size:10px;color:var(--suave)}
.rodape span{opacity:.7}
.autoria{margin:4px 0 0;font-size:13.5px;color:var(--texto)}
.autoria a{color:var(--destaque);font-weight:700;text-decoration:none;padding:6px 2px}
.autoria a:hover,.autoria a:focus-visible{text-decoration:underline}
.autoria i{font-style:normal;color:var(--suave);margin:0 3px}


/* ============================================================ os mundos */
.mundos{display:flex;flex-direction:column;gap:10px;width:100%;max-width:520px}
.mundo{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:12px;
  padding:10px 14px 10px 10px;border-radius:14px;text-align:left;
  background:linear-gradient(100deg,color-mix(in srgb,var(--escura) 26%,var(--cartao)) 0,var(--cartao) 70%)}
.mundo .selo{width:58px;height:58px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--clara) 0 25%,var(--escura) 0 50%,var(--clara) 0 75%,var(--escura) 0);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.mundo .selo img{width:44px;height:44px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.mundo .info{min-width:0;display:flex;flex-direction:column;gap:5px}
.mundo .info b{font-size:17px}
.mundo .info small{font-size:12px;font-weight:500;color:var(--suave)}
.mundo .progresso i{background:var(--escura);filter:brightness(1.25)}
.mundo .conta{text-align:right;font-variant-numeric:tabular-nums}
.mundo .conta b{display:block;font-size:16px}
.mundo .conta small{font-size:12px;color:var(--destaque)}
.mundo.completo{border-color:rgba(255,196,60,.5)}
.mundo:disabled{opacity:.55}
.mundo:disabled .selo{opacity:.7}

/* ============================================================ os níveis */
.grelha{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;width:100%;max-width:440px}
.grelha button{aspect-ratio:1;padding:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;border-radius:13px;background:var(--cartao2)}
.grelha button b{font-size:22px;font-variant-numeric:tabular-nums}
.grelha button i{font-style:normal;font-size:11px;letter-spacing:1px;color:var(--destaque)}
.grelha button s,.estrelasPequenas s{text-decoration:none;color:rgba(255,255,255,.16)}
.grelha button.feito{background:color-mix(in srgb,var(--escura) 42%,var(--cartao));
  border-color:color-mix(in srgb,var(--escura) 70%,transparent)}
/* o que está aberto e ainda não foi vencido chama: é para lá que se vai */
.grelha button.novo{border-color:var(--destaque);animation:nivelChama 1.8s ease-in-out infinite}
.grelha button:disabled b{font-size:16px}
@keyframes nivelChama{0%,100%{box-shadow:0 0 0 0 rgba(255,196,60,0)}50%{box-shadow:0 0 0 4px rgba(255,196,60,.22)}}
.nota{margin:4px 0 0;max-width:440px;text-align:center;font-size:12.5px;line-height:1.5;color:var(--suave)}

/* ========================================================= as conquistas */
.conquistas{display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px}
.conquista{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:12px;
  padding:10px 14px 10px 10px;border-radius:12px;background:var(--cartao);border:1px solid var(--linha)}
.conquista .icone{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:22px;background:var(--cartao2);filter:grayscale(1);opacity:.5}
.conquista .icone img{width:32px;height:32px}
.conquista .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.conquista .info b{font-size:15px}
.conquista .info small{font-size:12.5px;color:var(--suave)}
.conquista .conta{font-family:var(--mono);font-size:12px;color:var(--suave);font-variant-numeric:tabular-nums}
.conquista.ganha{border-color:rgba(255,196,60,.5);background:linear-gradient(100deg,rgba(255,196,60,.12),var(--cartao) 70%)}
.conquista.ganha .icone{filter:none;opacity:1;background:rgba(255,196,60,.2)}
.conquista.ganha .conta{color:var(--destaque);font-size:18px}

/* ================================================================ o jogo */

/* ---------------------------------------------------- as duas etapas */
.etapas{list-style:none;margin:0;padding:0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.etapas li{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:999px;
  font-size:13px;color:var(--suave);background:var(--cartao);border:1px solid var(--linha);
  transition:color .2s,border-color .2s,background .2s}
.etapas li img{width:22px;height:22px;opacity:.55;transition:opacity .2s}
.etapas li.atual{color:var(--texto);border-color:var(--destaque);background:rgba(255,196,60,.10)}
.etapas li.atual img{opacity:1}
.etapas li.feita{color:#9fe0a8;border-color:rgba(120,220,140,.45)}
.etapas li.feita span::after{content:' ✓'}

/* ------------------------------------------------------- o tabuleiro */
.tabuleiro{position:relative;width:max-content;user-select:none;touch-action:none;
  -webkit-touch-callout:none;border-radius:6px;
  box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 0 6px #232b3b,0 18px 40px -18px rgba(0,0,0,.9)}
.grade{display:grid;grid-template-columns:repeat(var(--larg,4),var(--casa,80px));
  grid-auto-rows:var(--casa,80px);border-radius:4px;overflow:hidden}

.casa{position:relative;background:var(--escura)}
.casa.clara{background:var(--clara)}
.casa::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:transparent;transition:background .12s linear}
.casa.escolhida::after{background:rgba(255,196,60,.55);box-shadow:inset 0 0 0 3px var(--destaque)}
.casa.mirada::after{background:rgba(255,196,60,.5);box-shadow:inset 0 0 0 4px #fff}
.casa.veio::after{background:rgba(255,196,60,.28)}
.casa.foi::after{background:rgba(255,196,60,.42)}

/* a bolinha de "pode ir": a mesma gramática do kit */
.casa.pode{cursor:pointer}
.casa.pode::before{content:'';position:absolute;left:50%;top:50%;width:31%;height:31%;
  transform:translate(-50%,-50%);border-radius:50%;background:rgba(20,30,20,.30);
  pointer-events:none;z-index:1}
.casa.clara.pode::before{background:rgba(20,30,20,.22)}

.casa .coord{position:absolute;font-family:var(--mono);font-weight:800;line-height:1;
  font-size:max(10px,calc(var(--casa,80px) * .19));color:var(--clara);pointer-events:none;z-index:1}
.casa.clara .coord{color:var(--escura)}
.casa .coord.fila{top:4px;left:5px}
.casa .coord.coluna{bottom:4px;right:6px}

/* O MURO. No rascunho eram dois peões pretos; peão preto num jogo de
   xadrez é coisa que se captura, e este não se captura nem se mexe.
   Tijolo diz "aqui não passa" sem precisar de legenda. */
.casa.muro svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.casa.muro{box-shadow:inset 0 6px 10px -6px rgba(0,0,0,.6)}
.casa.muro .coord{color:rgba(255,255,255,.55)}

/* A CASA-ALVO: a sombra da dama, para o destino final estar à vista desde
   o primeiro lance. Ela acende quando o peão promove. */
.alvo{position:absolute;inset:7%;border-radius:12%;border:2px dashed rgba(255,255,255,.55);
  display:flex;align-items:center;justify-content:center;pointer-events:none;
  transition:border-color .3s,box-shadow .3s}
.alvo img{width:78%;height:78%;opacity:.22;transition:opacity .3s}
.tabuleiro.promovido .alvo{border-color:var(--destaque);animation:alvoPulsa 1.4s ease-in-out infinite}
.tabuleiro.promovido .alvo img{opacity:.42}
@keyframes alvoPulsa{
  0%,100%{box-shadow:0 0 0 0 rgba(255,196,60,.0)}
  50%{box-shadow:0 0 0 5px rgba(255,196,60,.35),inset 0 0 14px rgba(255,196,60,.45)}
}

/* ---------------------------------------------------------- as peças */
.pecas{position:absolute;inset:0;pointer-events:none}
.peca{position:absolute;left:0;top:0;width:var(--casa,80px);height:var(--casa,80px);
  display:flex;align-items:center;justify-content:center;
  transition:transform 190ms cubic-bezier(.22,.86,.36,1);will-change:transform}
.peca img{width:86%;height:86%;display:block;-webkit-user-drag:none;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
/* O herói tem um brilho por baixo: entre treze peças brancas, é para ele
   que o olho tem de ir. */
.peca.heroi img{filter:drop-shadow(0 0 6px rgba(255,196,60,.95)) drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.peca.naMao{transition:none;z-index:5}
.peca.naMao img{filter:drop-shadow(0 10px 10px rgba(0,0,0,.6))}
.peca.chegando img{animation:pecaChega .34s cubic-bezier(.2,1.3,.4,1) backwards}
.peca.presa img{animation:pecaPresa .32s ease-out}
.peca.coroada img{animation:pecaCoroada .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pecaChega{from{opacity:0;transform:translateY(-35%) scale(.7)}to{opacity:1;transform:none}}
@keyframes pecaPresa{
  0%,100%{transform:translateX(0)} 25%{transform:translateX(-6%)} 75%{transform:translateX(6%)}
}
@keyframes pecaCoroada{
  0%{transform:scale(.4) rotate(-20deg)} 60%{transform:scale(1.25)} 100%{transform:scale(1)}
}

/* ----------------------------------------------------------- o painel */
.painel{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:420px}
.placar{margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.placar div{background:var(--cartao);border:1px solid var(--linha);border-radius:10px;
  padding:8px 6px;text-align:center}
.placar dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--suave)}
.placar dd{margin:2px 0 0;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;
  transition:color .2s}
/* passou do teto das três estrelas: o número avisa, sem bronca */
.placar dd.acima{color:#ffb089}
.metas{margin:0;font-size:12px;color:var(--suave)}
.metas b{color:var(--destaque);font-weight:400;letter-spacing:1px}
.botoes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* ---------------------------------------------------------- a vitória */
.vitoria{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:16px;background:rgba(6,10,18,.72);backdrop-filter:blur(3px);animation:vitoriaVeu .25s ease-out}
.vitoria[hidden]{display:none}
.cartao{width:100%;max-width:350px;padding:24px 18px 20px;border-radius:18px;text-align:center;
  background:var(--cartao);border:1px solid rgba(255,196,60,.45);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.9);animation:vitoriaCartao .35s cubic-bezier(.2,1.3,.4,1)}
.cartao h2{margin:8px 0 6px;font-size:23px;line-height:1.2}
.cartao p{margin:0 0 6px;color:var(--suave);font-size:14.5px;line-height:1.45}
.cartao p strong{color:var(--texto)}
.cartao .recorde{color:var(--destaque);font-weight:700}
.cartao .botoes{margin-top:16px}
.cartao .botoes button{padding:10px 14px}
.estrelas{font-size:48px;line-height:1;letter-spacing:6px}
.estrelas span{display:inline-block;color:#3a4358}
.estrelas span:nth-child(2){transform:translateY(-8px)}
.estrelas span.acesa{color:var(--destaque);text-shadow:0 0 18px rgba(255,196,60,.6);
  animation:estrelaAcende .45s cubic-bezier(.2,1.5,.4,1) .55s backwards}
.estrelas span.acesa:nth-child(2){animation-delay:.7s}
.estrelas span.acesa:nth-child(3){animation-delay:.85s}
@keyframes vitoriaVeu{from{opacity:0}to{opacity:1}}
@keyframes vitoriaCartao{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes estrelaAcende{from{opacity:0;scale:0;rotate:-40deg}to{opacity:1;scale:1;rotate:0deg}}

/* o confete sai do meio da tela, por cima de tudo, e não recebe toque */
.confete{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.confete i{position:absolute;top:45%;width:9px;height:14px;border-radius:2px}

/* os avisos de conquista descem do alto */
.avisos{position:fixed;top:12px;left:0;right:0;z-index:70;display:flex;flex-direction:column;
  align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.aviso{padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;color:#201a05;
  background:var(--destaque);box-shadow:0 12px 30px -10px rgba(0,0,0,.8);
  animation:avisoDesce .35s cubic-bezier(.2,1.3,.4,1);transition:opacity .4s,transform .4s}
.aviso.saindo{opacity:0;transform:translateY(-12px)}
@keyframes avisoDesce{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  .peca{transition-duration:0ms}
  .tela,.peca img,.alvo,.cartao,.estrelas span,.vitrine img,.grelha button,.aviso{animation:none!important}
}

/* =============================================================== no dedo

   Onde o ponteiro é um dedo, todo botão tem pelo menos 46 px de altura:
   abaixo disso erra-se o alvo, e "desfazer" ao lado de "reiniciar" é o
   pior lugar do jogo para errar. */
@media (pointer:coarse){
  .painel .botoes button,.cartao .botoes button{min-height:46px;padding:11px 18px;font-size:15px}
  .painel .botoes{gap:12px}
}

/* telefone estreito */
@media (max-width:380px){
  .grelha{gap:7px}
  .grelha button b{font-size:19px}
  .mundo{grid-template-columns:50px 1fr auto;gap:10px;padding-right:10px}
  .mundo .selo{width:50px;height:50px}
  .mundo .selo img{width:38px;height:38px}
  .mundo .info b{font-size:15.5px}
  .etapas li{font-size:12px;padding:5px 10px 5px 7px}
  .cartao .botoes button{padding:11px 12px}
}

/* telefone baixo, em pé: a tela inicial encolhe em vez de rolar */
@media (max-height:620px) and (orientation:portrait){
  .vitrine{height:62px}
  .vitrine img{width:40px;height:40px}
  .vitrine img.rainha{width:58px;height:58px}
  .chamada{margin-bottom:10px}
  .rodape{margin-top:14px}
}

/* O TELEFONE DEITADO. Em pé, tudo fica empilhado; deitado não há altura
   para isso, e o tabuleiro encolheria até não dar para tocar. Então ele
   ocupa a altura toda de um lado, e a barra, as etapas e o painel vão
   para o outro. A mesma pergunta está em `deitado`, em tela.js. */
@media (orientation:landscape) and (max-height:520px){
  body[data-tela="jogo"] #telaJogo{display:grid;grid-template-columns:auto minmax(190px,300px);
    grid-template-areas:"tab barra" "tab etapas" "tab painel";
    justify-content:center;align-content:center;align-items:center;column-gap:22px;row-gap:8px}
  #telaJogo .tabuleiro{grid-area:tab}
  #telaJogo .barra{grid-area:barra}
  #telaJogo .etapas{grid-area:etapas}
  #telaJogo .painel{grid-area:painel}
  #telaJogo .placar dd{font-size:19px}
  #telaJogo .placar div{padding:5px 4px}

  body[data-tela="inicio"] #telaInicio{display:grid;grid-template-columns:auto minmax(240px,320px);
    grid-template-areas:"vitrine menu" "logo menu" "chamada menu" "rodape menu";
    justify-content:center;align-content:center;align-items:center;column-gap:36px}
  #telaInicio .vitrine{grid-area:vitrine;height:56px}
  #telaInicio .vitrine img{width:36px;height:36px}
  #telaInicio .vitrine img.rainha{width:52px;height:52px}
  #telaInicio .logo{grid-area:logo;font-size:44px}
  #telaInicio .chamada{grid-area:chamada;margin:0}
  #telaInicio .menu{grid-area:menu}
  #telaInicio .rodape{grid-area:rodape;margin-top:6px}
  .mundos{display:grid;grid-template-columns:1fr 1fr;max-width:none}
  .grelha{grid-template-columns:repeat(10,1fr);max-width:none}
}

/* ======================================================================
   O QUE VEIO COM OS MODOS NOVOS: o recado do jogo, a dica, o modo livre,
   a aparência, as estatísticas e os ajustes.
   ====================================================================== */

/* ---------------------------------------------------- o recado do jogo
   Uma faixa só fala pelo tutorial, pela dica, pelo relógio, pelo desafio
   e pela solução. Ela fica no painel, colada ao tabuleiro. */
.recado{margin:0;width:100%;padding:8px 12px;border-radius:10px;text-align:center;font-size:13.5px;
  line-height:1.4;color:var(--texto);background:rgba(255,196,60,.12);border:1px solid rgba(255,196,60,.4)}
.recado[hidden]{display:none}
.recado.urgente{color:#ffd0d0;background:rgba(255,80,80,.16);border-color:rgba(255,90,90,.7);
  font-weight:700;animation:recadoPulsa .5s ease-in-out infinite alternate}
@keyframes recadoPulsa{from{transform:scale(1)}to{transform:scale(1.03)}}
.botoes[hidden]{display:none}

/* A DICA: a casa de onde sai e a casa aonde vai, as duas com um anel que
   pulsa. É o mesmo desenho que o tutorial usa — quem aprendeu com um
   reconhece o outro. */
.casa.dicaDe::after{box-shadow:inset 0 0 0 4px #5ad1ff;background:rgba(90,209,255,.28);
  animation:dicaPulsa .9s ease-in-out infinite alternate}
.casa.dicaPara::after{box-shadow:inset 0 0 0 4px #5ad1ff;background:rgba(90,209,255,.45);
  animation:dicaPulsa .9s ease-in-out infinite alternate-reverse}
@keyframes dicaPulsa{from{opacity:.55}to{opacity:1}}
.peca.apontada img{animation:pecaAponta .9s ease-in-out infinite alternate}
@keyframes pecaAponta{from{transform:translateY(0)}to{transform:translateY(-7%)}}

/* ------------------------------------------- os visuais das peças
   As douradas e as de néon são as mesmas peças, tingidas: o filtro vai
   na CAMADA das peças (ou na imagem solta da vitrine), e não em cada
   peça, para não brigar com o brilho do herói. */
.visual-douradas{filter:brightness(.86) sepia(1) saturate(2.6) hue-rotate(-16deg)}
.visual-neon{filter:drop-shadow(0 0 2px #39e6ff) drop-shadow(0 0 6px #39e6ff)}

/* ------------------------------------- modo livre e aparência: as escolhas */
.escolhas{width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px}
.escolhas h3,.estatisticas h3{margin:8px 0 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--suave);font-weight:600}
.opcoes{display:grid;grid-template-columns:1fr;gap:8px}
.opcoes.quatro{grid-template-columns:repeat(4,1fr)}
.opcoes button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px 14px;
  border-radius:12px;text-align:left;background:var(--cartao)}
.opcoes.quatro button{align-items:center;text-align:center;padding:11px 4px}
.opcoes button b{font-size:15px}
.opcoes.quatro button b{font-size:13px}
.opcoes button small{font-size:11.5px;font-weight:500;color:var(--suave)}
.opcoes button.ativa{border-color:var(--destaque);background:rgba(255,196,60,.12)}
.opcoes button.ativa small{color:var(--destaque)}
.opcoes button img{width:44px;height:44px}
button.centro{justify-content:center;margin-top:8px}

.amostra{display:grid;grid-template-columns:repeat(4,1fr);width:min(100%,280px);margin:0 auto 4px;
  border-radius:8px;overflow:hidden;box-shadow:0 0 0 5px #232b3b,0 14px 30px -14px rgba(0,0,0,.9)}
.amostra span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--escura)}
.amostra span.clara{background:var(--clara)}
.amostra img{width:84%;height:84%}
.xadrezinho{width:40px;height:40px;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);
  background:conic-gradient(var(--clara) 0 25%,var(--escura) 0 50%,var(--clara) 0 75%,var(--escura) 0)}
/* "do mundo": um pedaço de cada mundo */
.xadrezinho.arcoiris{background:conic-gradient(#769656 0 16%,#b58863 0 33%,#6f93b3 0 50%,#8a78b8 0 66%,#b0605a 0 83%,#4f6079 0)}

/* -------------------------------------------------------- as estatísticas */
.estatisticas{width:100%;max-width:520px;display:flex;flex-direction:column;gap:8px}
.quadros{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.quadros div{background:var(--cartao);border:1px solid var(--linha);border-radius:12px;padding:10px 12px}
.quadros dt{font-size:11.5px;color:var(--suave)}
.quadros dd{margin:3px 0 0;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.media{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:10px;font-size:13.5px}
.media .progresso i{background:var(--escura);filter:brightness(1.25)}
.media b{text-align:right;font-variant-numeric:tabular-nums}

/* -------------------------------------------- ajustes, regras e a vitória */
.chaves{display:flex;flex-direction:column;gap:2px;margin:10px 0 6px;text-align:left}
.chaves label{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 4px;border-bottom:1px solid var(--linha);font-size:15px;cursor:pointer}
.chaves label[hidden]{display:none}
.chaves input[type=checkbox]{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:13px;
  background:#3a4358;position:relative;cursor:pointer;transition:background .15s;flex:none;margin:0}
.chaves input[type=checkbox]::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;
  border-radius:50%;background:#fff;transition:transform .15s}
.chaves input[type=checkbox]:checked{background:var(--destaque)}
.chaves input[type=checkbox]:checked::after{transform:translateX(20px)}
.chaves select{font:inherit;font-size:14px;padding:7px 10px;border-radius:8px;color:var(--texto);
  background:var(--cartao2);border:1px solid var(--linha)}
button.perigo{color:#ff9b9b;border-color:rgba(255,120,120,.35);font-weight:500;font-size:13px}
.regras{margin:10px 0 4px;padding-left:22px;text-align:left;display:flex;flex-direction:column;gap:9px;
  font-size:14.5px;line-height:1.45;color:var(--texto)}
.regras li::marker{color:var(--destaque);font-weight:800}
.cartao .nota{font-size:12.5px;margin:8px 0 0}
.cartao .nota[hidden]{display:none}

.cartao .botoes.extras{margin-top:12px;gap:6px}
.cartao .botoes.extras button{padding:8px 11px;font-size:12.5px;font-weight:600;color:var(--suave);
  background:transparent}
.cartao .botoes.extras[hidden]{display:none}
.estrelas span.sem{color:var(--suave);font-size:44px}

@media (max-width:380px){
  .opcoes.quatro{gap:6px}
  .opcoes.quatro button b{font-size:12px}
  .opcoes.quatro button small{font-size:10.5px}

  .media{grid-template-columns:92px 1fr 30px}

/* ------------------------------------------------ a saída e a chegada

   Como em pista de jogo. A SAÍDA é a casa de onde o peão parte: moldura
   dourada e três setas subindo, uma atrás da outra, dizendo para onde
   ele vai. A CHEGADA é a casa da dama, o fim do nível: moldura
   quadriculada de bandeira de corrida em volta da sombra da dama. As
   duas ficam por BAIXO das peças e não recebem toque, e cada uma tem a
   sua placa escrita, que vale mesmo com peça por cima.

   Depois da coroação a saída se apaga — ela já cumpriu o papel — e a
   chegada é que passa a pulsar. */
.largada,.chegada{position:absolute;inset:0;pointer-events:none;transition:opacity .4s}
.tabuleiro.promovido .largada{opacity:.25}
.tabuleiro.promovido .largada i{animation:none}

.largada{display:flex;flex-direction:column-reverse;align-items:center;justify-content:center;gap:0;
  box-shadow:inset 0 0 0 3px rgba(255,196,60,.95),inset 0 0 18px rgba(255,196,60,.45);
  background:repeating-linear-gradient(135deg,rgba(255,196,60,.22) 0 8px,transparent 8px 16px)}
.largada i{width:34%;height:16%;margin-top:-3%;background:var(--destaque);
  clip-path:polygon(50% 0,100% 62%,100% 100%,50% 38%,0 100%,0 62%);
  animation:largadaSobe 1.2s linear infinite;opacity:.25}
.largada i:nth-child(2){animation-delay:.2s}
.largada i:nth-child(3){animation-delay:.4s}
@keyframes largadaSobe{0%,100%{opacity:.2}35%{opacity:1}70%{opacity:.2}}

/* a moldura: quadriculado preto e branco, com o meio vazado */
.chegada{padding:11%;
  background:conic-gradient(#111 0 25%,#fff 0 50%,#111 0 75%,#fff 0) 0 0/22% 22%;
  -webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
          mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
/* dentro da moldura, a sombra da dama dispensa o tracejado que tinha */
.casa:has(> .chegada) .alvo{inset:11%;border-radius:0;border-color:transparent}
.tabuleiro.promovido .casa:has(> .chegada) .alvo{border-color:transparent}

/* AS PLACAS: a palavra escrita, numa tarja na borda da casa. */
.placa{position:absolute;left:50%;transform:translateX(-50%);z-index:2;pointer-events:none;
  padding:2px 7px;border-radius:999px;white-space:nowrap;
  font-family:var(--mono);font-weight:800;text-transform:uppercase;letter-spacing:.08em;
  font-size:max(8px,calc(var(--casa,80px) * .115));line-height:1.25;transition:opacity .4s}
.placa.daLargada{top:3%;color:#201a05;background:var(--destaque);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.placa.daChegada{top:3%;color:#fff;background:#111;box-shadow:0 0 0 1.5px #fff,0 1px 3px rgba(0,0,0,.4)}
.tabuleiro.promovido .placa.daLargada{opacity:0}
.tabuleiro.promovido .placa.daChegada{color:#201a05;background:var(--destaque);box-shadow:0 0 0 1.5px #111,0 0 10px rgba(255,196,60,.8)}
@media (prefers-reduced-motion:reduce){
  .largada i{animation:none!important;opacity:.8}
}

  .vitrine img.rainha{width:50px;height:50px}
  .sequencia{margin:-2px 0 4px}
  .rodape{gap:6px}
}

  <script>
/* =====================================================================
   SLIDE CHESS — O MOTOR: a regra do jogo, sem nenhuma tela.

   O QUE ELE SABE: montar um nível a partir do mapa, dizer para onde uma
   peça pode ir, fazer o lance, promover o peão e reconhecer a vitória.
   NÃO sabe desenhar, salvar nem contar estrela — isso é de tela.js.

   Por não tocar em `document`, ele roda igual no navegador e no Node:
   é assim que o resolvedor confere se um nível tem solução e em quantos
   lances, antes de o nível ir para a mão de alguém.

   A REGRA, POR EXTENSO

     · as peças andam como no xadrez (torre, bispo, dama, rei, cavalo);
     · NINGUÉM CAPTURA: só se anda para casa vazia, e quem desliza não
       atravessa peça nem muro. O cavalo pula, como sempre;
     · o peão anda UMA casa para a frente, e só. Na última fileira ele
       vira dama sozinho;
     · vence quem leva essa dama — a que nasceu do peão — até a casa-alvo.
   ===================================================================== */

(function (raiz) {
  const COLUNAS = 'abcdefgh';

  const RETAS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const DIAGONAIS = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
  const SALTOS = [[1, 2], [2, 1], [-1, 2], [-2, 1], [1, -2], [2, -1], [-1, -2], [-2, -1]];
  const DIRECOES = { R: RETAS, B: DIAGONAIS, Q: RETAS.concat(DIAGONAIS), K: RETAS.concat(DIAGONAIS) };

  /** "a1" → índice na lista de casas. A linha 0 é a de CIMA, como na tela. */
  function indiceDe(nome, larg, alt) {
    return (alt - Number(nome.slice(1))) * larg + COLUNAS.indexOf(nome[0]);
  }

  function nomeDe(i, larg, alt) {
    return COLUNAS[i % larg] + (alt - Math.floor(i / larg));
  }

  /* O MAPA É TEXTO, uma linha por fileira, de cima para baixo:
     N B R Q K P são peças, `#` é muro e `.` é casa vazia. O peão é o herói:
     é a dama DELE que tem de chegar ao alvo, e não outra dama que um nível
     futuro venha a ter. */
  function criar(nivel) {
    const alt = nivel.mapa.length, larg = nivel.mapa[0].length;
    const casas = [];
    let id = 0;
    for (const linha of nivel.mapa) {
      for (const c of linha) {
        if (c === '.') casas.push(null);
        else if (c === '#') casas.push({ muro: true });
        else casas.push({ id: ++id, tipo: c, heroi: c === 'P' });
      }
    }
    return {
      larg, alt, casas,
      alvo: indiceDe(nivel.alvo, larg, alt),
      lances: 0, promovido: false, venceu: false
    };
  }

  /** Uma cópia solta do estado — é o que o "desfazer" guarda. */
  function copiar(e) {
    return Object.assign({}, e, { casas: e.casas.map(c => (c ? Object.assign({}, c) : null)) });
  }

  /** As casas (índices) para onde a peça em `de` pode ir agora. */
  function destinos(e, de) {
    const p = e.casas[de];
    if (!p || p.muro) return [];
    const lin = Math.floor(de / e.larg), col = de % e.larg;
    const livres = [];
    const livre = (l, c) =>
      l >= 0 && c >= 0 && l < e.alt && c < e.larg && e.casas[l * e.larg + c] === null;

    if (p.tipo === 'P') {
      if (livre(lin - 1, col)) livres.push((lin - 1) * e.larg + col);
    } else if (p.tipo === 'N') {
      for (const [dl, dc] of SALTOS) if (livre(lin + dl, col + dc)) livres.push((lin + dl) * e.larg + col + dc);
    } else {
      const umPasso = p.tipo === 'K';
      for (const [dl, dc] of DIRECOES[p.tipo]) {
        let l = lin + dl, c = col + dc;
        while (livre(l, c)) {
          livres.push(l * e.larg + c);
          if (umPasso) break;
          l += dl; c += dc;
        }
      }
    }
    return livres;
  }

  /** Faz o lance no próprio estado. Devolve o que aconteceu. */
  function mover(e, de, para) {
    if (e.venceu || !destinos(e, de).includes(para)) return { ok: false };
    const p = e.casas[de];
    e.casas[para] = p;
    e.casas[de] = null;
    e.lances++;

    let promoveu = false;
    if (p.tipo === 'P' && para < e.larg) {
      p.tipo = 'Q';
      promoveu = true;
      if (p.heroi) e.promovido = true;
    }
    if (p.heroi && p.tipo === 'Q' && para === e.alvo) e.venceu = true;
    return { ok: true, promoveu, venceu: e.venceu };
  }

  raiz.SlideMotor = { criar, copiar, destinos, mover, indiceDe, nomeDe };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
  <script>
/* =====================================================================
   SLIDE CHESS — O RESOLVEDOR: acha o caminho mais curto até a vitória.

   É ele que responde ao botão de DICA, que joga a SOLUÇÃO depois da
   vitória e que guia o TUTORIAL. E é o mesmo código que o gerador de
   níveis usa no Node para conferir cada nível antes de ele existir — a
   dica nunca sabe menos do que quem fez o nível.

   POR QUE NÃO É O MOTOR
     O motor (motor.js) é a regra escrita para ser lida. Aqui a mesma
     regra é escrita para ser RÁPIDA: como ninguém captura, o tabuleiro
     tem sempre UMA casa vazia, e todo lance é "alguém entra nela". A
     posição inteira vira um número só, e a busca em largura anda por
     centenas de milhares de posições em menos de um segundo.

   O LIMITE
     A busca para em `limite` posições (dois milhões, uns 45 MB): num
     telefone, memória é o que acaba primeiro. Todo nível do jogo foi
     conferido pelo gerador para caber no limite a partir da posição
     inicial; depois de muitos lances tortos pode não caber, e aí o
     resolvedor diz `estourou` e a tela oferece voltar ao caminho.

   FORA DA TELA
     No navegador a busca roda num Worker, para o jogo não congelar
     enquanto pensa. O Worker nasce do TEXTO da função `nucleo` — é por
     isso que ela não usa nada de fora dela — e assim o jogo continua

  function pedir(estado, limite) {

      const n = ++numero;
      esperando.set(n, r => resolve(r || N.resolver(p)));
      worker.postMessage({ n, p });
    });

/* =====================================================================
   SLIDE CHESS — O SOM E A MÚSICA.

   Nenhum arquivo de áudio: cada som é desenhado na hora pelo navegador
   (Web Audio). São meia dúzia de notas e um estalo de madeira — o jogo
   continua abrindo direto do disco, sem nada para baixar.

   O navegador só deixa tocar depois de um gesto da pessoa, e por isso o
   contexto de áudio nasce no primeiro `tocar`, que sempre vem de um
   toque ou clique.

   A MÚSICA é um tapete: quatro acordes lentos e um dedilhado baixinho,
   repetindo. Ela tem chave própria, separada dos efeitos — quem joga no
   ônibus quer o estalo da peça e não a trilha, e quem joga em casa pode
   querer o contrário. Ela para quando a aba some, para não ficar
   tocando no bolso de ninguém.
   ===================================================================== */

window.SlideSom = (() => {
  let ctx = null, ligado = true;

  function contexto() {
    if (!ctx) {
      const Classe = window.AudioContext || window.webkitAudioContext;
      if (!Classe) return null;
      ctx = new Classe();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  /** Uma nota com ataque seco e cauda curta. */
  function nota(freq, quando, duracao, forma, volume, saida) {
    const osc = ctx.createOscillator(), ganho = ctx.createGain();
    const t = ctx.currentTime + quando;
    osc.type = forma;
    osc.frequency.setValueAtTime(freq, t);
    ganho.gain.setValueAtTime(0.0001, t);
    ganho.gain.exponentialRampToValueAtTime(volume, t + 0.012);
    ganho.gain.exponentialRampToValueAtTime(0.0001, t + duracao);
    osc.connect(ganho).connect(saida || ctx.destination);
    osc.start(t);
    osc.stop(t + duracao + 0.02);
  }

  /** O estalo da peça na madeira: um sopro de ruído filtrado e um baque grave. */
  function estalo(volume) {
    const n = Math.floor(ctx.sampleRate * 0.05);
    const amostra = ctx.createBuffer(1, n, ctx.sampleRate);
    const dados = amostra.getChannelData(0);
    for (let i = 0; i < n; i++) dados[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    const fonte = ctx.createBufferSource(), filtro = ctx.createBiquadFilter(), ganho = ctx.createGain();
    fonte.buffer = amostra;
    filtro.type = 'bandpass';
    filtro.frequency.value = 1500;
    filtro.Q.value = 0.9;
    ganho.gain.value = volume;
    fonte.connect(filtro).connect(ganho).connect(ctx.destination);
    fonte.start();
    nota(150, 0, 0.09, 'sine', volume * 0.8);

    preso: () => { nota(120, 0, 0.11, 'square', 0.04); nota(95, 0.07, 0.12, 'square', 0.04); },
    clique: () => nota(700, 0, 0.05, 'triangle', 0.05),
    dica: () => { nota(880, 0, 0.12, 'sine', 0.07); nota(1175, 0.09, 0.18, 'sine', 0.07); },
    coroar: () => [523, 659, 784, 1047].forEach((f, i) => nota(f, i * 0.07, 0.22, 'triangle', 0.11)),
    vencer: () => {

      [523, 659, 784, 1319].forEach(f => nota(f, 0.42, 0.7, 'sine', 0.07));

    perder: () => [392, 330, 262, 196].forEach((f, i) => nota(f, i * 0.14, 0.34, 'triangle', 0.1)),

    estrela: () => { nota(1319, 0, 0.18, 'sine', 0.09); nota(1976, 0.03, 0.2, 'sine', 0.05); },
    conquista: () => [784, 988, 1175, 1568].forEach((f, i) => nota(f, i * 0.08, 0.28, 'sine', 0.09))
  };

      const freq = acorde[DEDILHADO[passo % 8]] * (passo % 16 >= 8 ? 4 : 2);
      nota(freq, proxima - ctx.currentTime, PASSO * 2.4, 'triangle', passo % 4 === 0 ? 0.2 : 0.12, saidaMusica);
      proxima += PASSO;
      passo++;
    }
  }

  function atualizarMusica() {
    const deve = musicaQuer && !document.hidden;
    if (deve && !relogio) {
      if (!contexto()) return;
      if (!saidaMusica) {
        saidaMusica = ctx.createGain();
        saidaMusica.connect(ctx.destination);
      }
      saidaMusica.gain.cancelScheduledValues(ctx.currentTime);
      saidaMusica.gain.setValueAtTime(0.0001, ctx.currentTime);
      saidaMusica.gain.linearRampToValueAtTime(0.16, ctx.currentTime + 1.5);
      proxima = ctx.currentTime + 0.1;
      agendar();
      relogio = setInterval(agendar, 200);
    } else if (!deve && relogio) {
      clearInterval(relogio);
      relogio = null;
      saidaMusica.gain.cancelScheduledValues(ctx.currentTime);
      saidaMusica.gain.setValueAtTime(saidaMusica.gain.value, ctx.currentTime);
      saidaMusica.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
    }
  }
  document.addEventListener('visibilitychange', () => { try { atualizarMusica(); } catch { /* sem áudio */ } });

  return {
    tocar(nome) {
      if (!ligado || !SONS[nome]) return;
      try { if (contexto()) SONS[nome](); } catch { /* sem áudio: o jogo segue mudo */ }
    },
    ligar(sim) { ligado = !!sim; },
    /** Liga ou desliga a música. Só começa de fato depois de um gesto da pessoa. */
    musica(sim) {
      musicaQuer = !!sim;
      try { atualizarMusica(); } catch { /* sem áudio */ }
    },
    get ligado() { return ligado; }
  };
})();
