  <script>
/* =====================================================================
   SLIDE CHESS — A TELA: as telas do jogo, o dedo e o que se guarda.

   A regra não mora aqui: quem diz para onde a peça pode ir e quando o
   nível acabou é o motor (motor.js). Quem sabe o caminho mais curto é o
   resolvedor (resolvedor.js). Este arquivo mostra, pergunta e anota.

   AS TELAS
     início, mundos, níveis, modo livre, jogo, conquistas, aparência e
     estatísticas. Só uma aparece por vez, escolhida por `data-tela` no
     <body>; quem troca é `mostrar`. Não há endereço por tela: é um jogo,
     e não um site.

   A PARTIDA
     O mesmo tabuleiro serve a quatro jeitos de jogar, e `partida.tipo`
     diz qual: `campanha` (os mundos), `diario` (o desafio do dia),
     `livre` (níveis avulsos, com ou sem relógio) e `desafio` (o link que
     um amigo mandou). O que muda entre eles é o cabeçalho, o que a
     vitória anota e para onde os botões levam — a mecânica é uma só.

   O QUE VEIO DO TABULEIRO DO KIT
     · a casa em pixel inteiro, medida aqui e escrita em `--casa`;
     · clique-clique E arrasto, os dois, sem modo para escolher;
     · a peça sem lance treme em vez de ficar muda;
     · as bolinhas nas casas de destino.

   O QUE É DAQUI
     · as peças vivem numa camada só delas e andam por `transform`: cada
       uma tem o seu elemento do começo ao fim do nível, e por isso o
       lance — e o desfazer — é um deslize, e não um redesenho.

   O QUE SE GUARDA, E ONDE
     Tudo num objeto só, no `localStorage`, e não em cookie: o cookie não
     funciona com o jogo aberto direto do arquivo (file://), e viaja para
     o servidor a cada pedido sem ninguém ter pedido. É o mesmo "fica
     salvo neste navegador", sem os dois defeitos.
   ===================================================================== */

(function () {
  const M = window.SlideMotor;
  const R = window.SlideResolvedor;
  const NIVEIS = window.SlideNiveis;
  const RESERVA = window.SlideReserva;
  const MUNDOS = window.SlideMundos;
  const VISUAIS = window.SlideVisuais;
  const CONQUISTAS = window.SlideConquistas;
  const Som = window.SlideSom;
  const Texto = window.SlideTexto;
  const t = Texto.t;
  const $ = id => document.getElementById(id);

  const CHAVE = 'slidechess_v2', CHAVE_ANTIGA = 'slidechess_v1';
  const POR_MUNDO = 20;
  const NA_CAMPANHA = MUNDOS.filter(m => !m.estrelas).length * POR_MUNDO;

  /* AS DUAS REGRAS DE PASSAGEM, e por que nenhuma é "vença tudo":
     um quebra-cabeça em que se empaca não pode ser a porta do resto do
     jogo. Dentro do mundo dá para deixar até dois níveis para depois; e
     o mundo seguinte abre com quinze dos vinte. */
  const PULOS = 2;
  const PARA_ABRIR_MUNDO = 15;

  /* As faixas do modo livre, iguais às do gerador. */
  const FAIXAS = { facil: [16, 20], medio: [21, 25], dificil: [26, 32], extremo: [33, 52] };
  /* Contra o relógio: seis segundos por lance do mínimo, e nunca menos de
     um minuto. Lances contados: 30% de folga sobre o mínimo. */
  const tempoDoNivel = nv => Math.max(60, nv.minimo * 6);
  const lancesDoNivel = nv => Math.ceil(nv.minimo * 1.3);

  const elTab = $('tabuleiro'), elGrade = $('grade'), elPecas = $('pecas');
  const semMovimento = window.matchMedia('(prefers-reduced-motion: reduce)');
  /* O telefone deitado: a mesma pergunta que o estilo.css faz para pôr o
     tabuleiro de um lado e o painel do outro. */
  const deitado = window.matchMedia('(orientation: landscape) and (max-height: 520px)');

  /* ====================================================== o que se guarda

     O REGISTRO DE CADA NÍVEL É GUARDADO PELA ARRUMAÇÃO DAS PEÇAS, e não
     pelo número: a campanha pode ser reordenada, e o recorde tem de
     continuar sendo do mesmo quebra-cabeça. */

  const salvo = (() => {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(CHAVE)); } catch { /* começa do zero */ }
    if (!s) {
      s = { niveis: {} };
      try {                                    // a primeira versão guardava tudo solto
        const velho = JSON.parse(localStorage.getItem(CHAVE_ANTIGA)) || {};
        for (const k in velho) if (velho[k] && velho[k].melhor) s.niveis[k === '1' ? NIVEIS[0].chave : k] = velho[k];
      } catch { /* nada a trazer */ }
    }
    s.niveis = s.niveis || {};
    s.conquistas = s.conquistas || {};
    s.estat = Object.assign({
      lances: 0, semDesfazer: 0, recordes: 0, rapidas: 0, tempo: 0, dicas: 0,
      vitorias: 0, diarios: 0, livres: 0, relogio: 0
    }, s.estat);
    s.diario = s.diario || {};
    s.dias = Object.assign({ ultimo: '', sequencia: 0, maior: 0 }, s.dias);
    s.visual = Object.assign({ pecas: 'brancas', tabuleiro: 'mundo' }, s.visual);
    s.livre = Object.assign({ dif: 'medio', regra: 'livre' }, s.livre);
    if (s.som === undefined) s.som = true;
    if (s.musica === undefined) s.musica = false;
    if (s.vibrar === undefined) s.vibrar = true;
    if (!s.idioma) s.idioma = Texto.doAparelho();
    /* Quem já venceu algum nível não precisa da mão guiando o primeiro. */
    if (s.tutorial === undefined) s.tutorial = Object.keys(s.niveis).length > 0;
    return s;
  })();

  function gravar() {
    try { localStorage.setItem(CHAVE, JSON.stringify(salvo)); } catch { /* navegação privada: joga sem guardar */ }
  }

  /** O tranco curto do telefone a cada lance. Onde não existe, não faz nada. */
  function vibrar(padrao) {
    if (!salvo.vibrar) return;
    try { if (navigator.vibrate) navigator.vibrate(padrao); } catch { /* sem vibração */ }
  }

  /* ------------------------------------------------------------- os dias */

  const doisDigitos = n => String(n).padStart(2, '0');
  const chaveDoDia = d => `${d.getFullYear()}-${doisDigitos(d.getMonth() + 1)}-${doisDigitos(d.getDate())}`;
  const hoje = () => chaveDoDia(new Date());
  function ontem() {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return chaveDoDia(d);
  }
  const dataCurta = () => { const d = new Date(); return doisDigitos(d.getDate()) + '/' + doisDigitos(d.getMonth() + 1); };

  /** Quantos dias seguidos com vitória, contando hoje ou parando ontem. */
  const sequenciaAtual = () =>
    (salvo.dias.ultimo === hoje() || salvo.dias.ultimo === ontem() ? salvo.dias.sequencia : 0);

  function registrarDia() {
    const d = salvo.dias;
    if (d.ultimo === hoje()) return;
    d.sequencia = d.ultimo === ontem() ? d.sequencia + 1 : 1;
    d.ultimo = hoje();
    d.maior = Math.max(d.maior, d.sequencia);
  }

  /* ----------------------------------------------------------- os níveis */

  const registroDe = nv => salvo.niveis[nv.chave] || {};
  const feito = n => !!registroDe(NIVEIS[n]).melhor;
  const inicioDoMundo = m => m * POR_MUNDO;
  const nomeDoMundo = m => Texto.mundo(m)[0];

  function feitosNoMundo(m) {
    let conta = 0;
    for (let n = inicioDoMundo(m); n < inicioDoMundo(m + 1); n++) if (feito(n)) conta++;
    return conta;
  }

  function totalDeEstrelas() {
    let soma = 0;
    for (const nv of NIVEIS) { const reg = registroDe(nv); if (reg.melhor) soma += reg.estrelas || 1; }
    return soma;
  }

  /* Mundo da campanha abre pelo anterior; mundo bônus abre por estrelas. */
  const mundoAberto = m => (MUNDOS[m].estrelas
    ? totalDeEstrelas() >= MUNDOS[m].estrelas
    : m === 0 || feitosNoMundo(m - 1) >= PARA_ABRIR_MUNDO);

  function nivelAberto(n) {
    const m = NIVEIS[n].mundo;
    if (!mundoAberto(m)) return false;
    if (feito(n)) return true;
    let pendentes = 0;
    for (let i = inicioDoMundo(m); i < n; i++) if (!feito(i)) pendentes++;
    return pendentes <= PULOS;
  }

  /** O que as conquistas e os cabeçalhos precisam saber, contado de uma vez. */
  function resumo() {
    const r = {
      feitos: 0, estrelas: 0, perfeitos: 0, campanha: 0, mundos: MUNDOS.map(() => 0),
      estrelasPorMundo: MUNDOS.map(() => 0), maiorSequencia: salvo.dias.maior, estat: salvo.estat
    };
    NIVEIS.forEach(nv => {
      const reg = registroDe(nv);
      if (!reg.melhor) return;
      r.feitos++;
      r.estrelas += reg.estrelas || 1;
      r.mundos[nv.mundo]++;
      r.estrelasPorMundo[nv.mundo] += reg.estrelas || 1;
      if (nv.id <= NA_CAMPANHA) r.campanha++;
      if (reg.melhor <= nv.minimo && !reg.comDica) r.perfeitos++;
    });
    return r;
  }

  /** Onde o botão "Jogar" leva: onde se parou, ou o primeiro nível por vencer. */
  function nivelParaContinuar() {
    const parou = NIVEIS.findIndex(nv => nv.chave === salvo.atual);
    if (parou >= 0 && nivelAberto(parou) && !feito(parou)) return parou;
    const proximo = NIVEIS.findIndex((_, n) => !feito(n) && nivelAberto(n));
    return proximo >= 0 ? proximo : Math.max(0, parou);
  }

  const nivelAvulso = (pecas, minimo) =>
    window.SlideNivel([pecas.slice(0, 4), pecas.slice(4, 8), pecas.slice(8, 12), '.##P'], minimo);

  /* O DESAFIO DO DIA é o mesmo para todo mundo: a data vira um número, o
     número é embaralhado, e o resultado aponta para um nível da reserva. */
  function nivelDoDia() {
    const d = new Date();
    let x = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5) + 0x6D2B79F5;
    x = Math.imul(x ^ (x >>> 15), 1 | x);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    const lista = RESERVA.medio.concat(RESERVA.dificil);
    const [pecas, minimo] = lista[((x ^ (x >>> 14)) >>> 0) % lista.length];
    return nivelAvulso(pecas, minimo);
  }

  const estrelasDe = (nv, lances) => (lances <= nv.estrelas[0] ? 3 : lances <= nv.estrelas[1] ? 2 : 1);
  const desenhoEstrelas = n => '★'.repeat(n) + '<s>' + '★'.repeat(3 - n) + '</s>';

  /* ---------------------------------------------------------- os visuais */

  const visualDe = (lista, id) => VISUAIS[lista].find(v => v.id === id) || VISUAIS[lista][0];

  /* No arquivo único (ver ferramentas/empacotar.cjs) as peças vêm embutidas
     em `SlidePecas`; solto na pasta, o jogo as busca em pecas/. */
  function arquivoDaPeca(tipo, conjunto) {
    const nome = (conjunto || 'b') + tipo.toLowerCase();
    return (window.SlidePecas && window.SlidePecas[nome]) || 'pecas/' + nome + '.svg';
  }
  const pecaDoTabuleiro = tipo => arquivoDaPeca(tipo, visualDe('pecas', salvo.visual.pecas).arquivo);

  /** As duas cores do tabuleiro: as que a pessoa escolheu, ou as do mundo. */
  function coresDoTabuleiro(mundo) {
    const escolhido = visualDe('tabuleiros', salvo.visual.tabuleiro);
    return escolhido.escura ? escolhido : MUNDOS[mundo === undefined ? 0 : mundo];
  }
  function pintar(el, cores) {
    el.style.setProperty('--escura', cores.escura);
    el.style.setProperty('--clara', cores.clara);
  }

  /* ============================================================ as telas */

  let mundoAtual = 0;

  function mostrar(tela) {
    if (document.body.dataset.tela === 'jogo' && tela !== 'jogo') pararPartida();
    document.body.dataset.tela = tela;
    $('vitoria').hidden = true;
    if (tela === 'inicio') desenharInicio();
    else if (tela === 'mundos') desenharMundos();
    else if (tela === 'niveis') desenharNiveis();
    else if (tela === 'livre') desenharLivre();
    else if (tela === 'conquistas') desenharConquistas();
    else if (tela === 'aparencia') desenharAparencia();
    else if (tela === 'estatisticas') desenharEstatisticas();
    window.scrollTo(0, 0);
  }

  function desenharInicio() {
    const r = resumo(), nv = NIVEIS[nivelParaContinuar()];
    $('jogarTitulo').textContent = r.feitos ? t('continuar') : t('jogar');
    $('jogarOnde').textContent = t('onde', { mundo: nomeDoMundo(nv.mundo), n: nv.numero });
    $('resumoEstrelas').textContent = '★ ' + r.estrelas;
    $('resumoConquistas').textContent =
      t('aDeB', { a: CONQUISTAS.filter(c => salvo.conquistas[c.id]).length, b: CONQUISTAS.length });
    const doDia = salvo.diario[hoje()];
    $('resumoDiario').textContent = doDia ? t('diarioFeito', { n: doDia.lances }) : t('diarioNovo');
    $('irDiario').classList.toggle('chama', !doDia);
    const dias = sequenciaAtual();
    $('sequencia').hidden = !dias;
    $('sequencia').textContent = dias === 1 ? t('dia1') : t('diaN', { n: dias });
  }

  function desenharMundos() {
    const r = resumo();
    $('mundosResumo').textContent = t('mundosResumo', { a: r.feitos, b: NIVEIS.length, e: r.estrelas });
    $('mundosLista').innerHTML = MUNDOS.map((mundo, m) => {
      const aberto = mundoAberto(m), feitos = r.mundos[m];
      const linha = aberto ? Texto.mundo(m)[1]
        : mundo.estrelas ? t('mundoFechadoEstrelas', { n: mundo.estrelas, f: mundo.estrelas - r.estrelas })
        : t('mundoFechado', { n: PARA_ABRIR_MUNDO, mundo: nomeDoMundo(m - 1), f: PARA_ABRIR_MUNDO - r.mundos[m - 1] });
      return `<button type="button" class="mundo${feitos === POR_MUNDO ? ' completo' : ''}" data-m="${m}"` +
        ` style="--escura:${mundo.escura};--clara:${mundo.clara}"${aberto ? '' : ' disabled'}>` +
        `<span class="selo"><img src="${arquivoDaPeca(mundo.peca)}" alt=""></span>` +
        `<span class="info"><b>${m + 1} · ${nomeDoMundo(m)}</b><small>${linha}</small>` +
        `<span class="progresso"><i style="width:${feitos / POR_MUNDO * 100}%"></i></span></span>` +
        `<span class="conta"><b>${feitos}/${POR_MUNDO}</b><small>★ ${r.estrelasPorMundo[m]}</small></span></button>`;
    }).join('');
  }

  function desenharNiveis() {
    const feitos = feitosNoMundo(mundoAtual);
    const lista = $('niveisLista');
    pintar(lista, MUNDOS[mundoAtual]);
    $('niveisMundo').textContent = `${mundoAtual + 1} · ${nomeDoMundo(mundoAtual)}`;
    $('niveisResumo').textContent = t('niveisResumo', { a: feitos, b: POR_MUNDO });
    let html = '';
    for (let n = inicioDoMundo(mundoAtual); n < inicioDoMundo(mundoAtual + 1); n++) {
      const nv = NIVEIS[n], reg = registroDe(nv), aberto = nivelAberto(n);
      html += `<button type="button" data-n="${n}" class="${reg.melhor ? 'feito' : aberto ? 'novo' : ''}"` +
        `${aberto ? '' : ' disabled'} aria-label="${t('nivelN', { n: nv.numero })}${aberto ? '' : ', ' + t('bloqueado')}">` +
        `<b>${aberto ? nv.numero : '🔒'}</b><i>${desenhoEstrelas(reg.estrelas || 0)}</i></button>`;
    }
    lista.innerHTML = html;
    const seguinte = mundoAtual + 1;
    const falta = seguinte < MUNDOS.length && !MUNDOS[seguinte].estrelas && !mundoAberto(seguinte);
    $('niveisNota').textContent =
      (falta ? t('notaAbrir', { n: PARA_ABRIR_MUNDO, mundo: nomeDoMundo(seguinte) }) : '') + t('notaPular', { n: PULOS });
  }

  function desenharLivre() {
    $('livreDificuldade').innerHTML = Object.keys(FAIXAS).map(dif =>
      `<button type="button" data-dif="${dif}" class="${salvo.livre.dif === dif ? 'ativa' : ''}">` +
      `<b>${t(dif)}</b><small>${t('faixaLances', { a: FAIXAS[dif][0], b: FAIXAS[dif][1] })}</small></button>`).join('');
    $('livreRegra').innerHTML = [['livre', 'regraLivre'], ['tempo', 'regraTempo'], ['lances', 'regraLances']].map(([id, chave]) =>
      `<button type="button" data-regra="${id}" class="${salvo.livre.regra === id ? 'ativa' : ''}">` +
      `<b>${t(chave)}</b><small>${t(chave + 'Sub')}</small></button>`).join('');
    $('livreNota').textContent = t('livreVencidos', { n: salvo.estat.livres });
  }

  function desenharConquistas() {
    const r = resumo();
    const ganhas = CONQUISTAS.filter(c => salvo.conquistas[c.id]).length;
    $('conquistasResumo').textContent = t('aDeB', { a: ganhas, b: CONQUISTAS.length });
    $('conquistasLista').innerHTML = CONQUISTAS.map(c => {
      const tem = !!salvo.conquistas[c.id], valor = Math.min(c.meta, c.valor(r));
      const [nome, texto] = Texto.conquista(c.id, c.mundo);
      const icone = c.peca ? `<img src="${arquivoDaPeca(c.peca)}" alt="">` : c.icone;
      return `<div class="conquista${tem ? ' ganha' : ''}"><span class="icone">${icone}</span>` +
        `<span class="info"><b>${nome}</b><small>${texto}</small>` +
        (tem || c.meta === 1 ? '' : `<span class="progresso"><i style="width:${valor / c.meta * 100}%"></i></span>`) +
        `</span><span class="conta">${tem ? '✓' : c.meta === 1 ? '' : valor + '/' + c.meta}</span></div>`;
    }).join('');
  }

  function desenharAparencia() {
    const estrelas = totalDeEstrelas();
    $('aparenciaResumo').textContent = t('aparenciaSub', { n: estrelas });
    const pecas = visualDe('pecas', salvo.visual.pecas);
    const amostra = $('amostra');
    pintar(amostra, coresDoTabuleiro(0));
    amostra.innerHTML = 'NBRQ'.split('').map((tipo, i) =>
      `<span class="${i % 2 ? '' : 'clara'}"><img class="visual-${pecas.id}" src="${arquivoDaPeca(tipo, pecas.arquivo)}" alt=""></span>`).join('');

    const opcao = (lista, v, miolo) => {
      const tem = estrelas >= v.estrelas, ativa = salvo.visual[lista === 'pecas' ? 'pecas' : 'tabuleiro'] === v.id;
      return `<button type="button" data-lista="${lista}" data-id="${v.id}" class="${ativa ? 'ativa' : ''}"${tem ? '' : ' disabled'}>` +
        `${miolo}<b>${t((lista === 'pecas' ? 'pecas.' : 'tab.') + v.id)}</b>` +
        `<small>${tem ? (ativa ? '✓' : '&nbsp;') : '🔒 ' + t('falta', { n: v.estrelas })}</small></button>`;
    };
    $('aparenciaPecas').innerHTML = VISUAIS.pecas.map(v =>
      opcao('pecas', v, `<img class="visual-${v.id}" src="${arquivoDaPeca('N', v.arquivo)}" alt="">`)).join('');
    $('aparenciaTabuleiros').innerHTML = VISUAIS.tabuleiros.map(v =>
      opcao('tabuleiros', v, v.escura
        ? `<span class="xadrezinho" style="--escura:${v.escura};--clara:${v.clara}"></span>`
        : `<span class="xadrezinho arcoiris"></span>`)).join('');
  }

  function desenharEstatisticas() {
    const r = resumo(), e = salvo.estat;
    const horas = Math.floor(e.tempo / 3600), minutos = Math.floor(e.tempo % 3600 / 60);
    const quadros = [
      ['tempoJogado', horas ? `${horas} h ${minutos} min` : `${minutos} min`],
      ['lancesFeitos', e.lances.toLocaleString(Texto.atual)],
      ['niveisVencidos', `${r.feitos} / ${NIVEIS.length}`],
      ['estrelasJuntas', `★ ${r.estrelas}`],
      ['noMinimo', r.perfeitos],
      ['vitoriasTotais', e.vitorias],
      ['sequenciaAtual', t('nDias', { n: sequenciaAtual() })],
      ['maiorSequencia', t('nDias', { n: salvo.dias.maior })],
      ['diariosVencidos', e.diarios],
      ['livresVencidos', e.livres],
      ['dicasUsadas', e.dicas]
    ];
    $('estatisticasLista').innerHTML =
      '<div class="quadros">' + quadros.map(([chave, valor]) =>
        `<div><dt>${t(chave)}</dt><dd>${valor}</dd></div>`).join('') + '</div>' +
      `<h3>${t('mediaPorMundo')}</h3>` +
      MUNDOS.map((mundo, m) => {
        const media = r.mundos[m] ? r.estrelasPorMundo[m] / r.mundos[m] : 0;
        return `<div class="media" style="--escura:${mundo.escura}"><span>${nomeDoMundo(m)}</span>` +
          `<span class="progresso"><i style="width:${media / 3 * 100}%"></i></span>` +
          `<b>${r.mundos[m] ? media.toFixed(1).replace('.', Texto.atual === 'en' ? '.' : ',') : '—'}</b></div>`;
      }).join('');
  }

  /* As conquistas são conferidas depois de cada vitória; a que acabou de
     sair vira um aviso no alto da tela. */
  function conferirConquistas(calado) {
    const r = resumo(), novas = [];
    for (const c of CONQUISTAS) {
      if (salvo.conquistas[c.id] || c.valor(r) < c.meta) continue;
      salvo.conquistas[c.id] = Date.now();
      novas.push(c);
    }
    if (!calado) novas.forEach((c, i) => setTimeout(() => {
      Som.tocar('conquista');
      avisar((c.peca ? '🏅' : c.icone) + ' ' + t('conquistaAviso', { nome: Texto.conquista(c.id, c.mundo)[0] }));
    }, 1500 + i * 1300));
    return novas.length;
  }

  function avisar(texto) {
    const aviso = document.createElement('div');
    aviso.className = 'aviso';
    aviso.textContent = texto;
    $('avisos').appendChild(aviso);
    setTimeout(() => aviso.classList.add('saindo'), 3200);
    setTimeout(() => aviso.remove(), 3700);
  }

  /* ============================================================= a partida */

  let partida = null;          // {tipo, nivel, indice?, regra?, dif?, meta?}
  let nivel, estado;
  let historico = [];          // estados anteriores, para o desfazer
  let escolhida = null;        // índice da casa da peça escolhida
  let ultimo = null;           // {de, para} do último lance, para o realce
  let arrasto = null;
  let desfezAlgum = false;     // para a conquista "mão firme"
  let usouDica = false;        // com dica, o nível vale no máximo duas estrelas
  let comecou = 0;             // a hora do primeiro lance
  let acabou = false;          // perdeu no relógio ou nos lances: o tabuleiro trava
  let caminho = null;          // o resto da solução a partir daqui, se já foi calculada
  let pedido = 0;              // cada mudança de posição invalida a resposta que vinha vindo
  let pensando = false;
  let dicaNaTela = null;       // {de, para} que está brilhando
  let recado = '';             // a frase passageira: dica ou tutorial
  let passoDoTutorial = null;  // 0, 1, 2 enquanto a mão guia; null fora dele
  let assistindo = null;       // a solução sendo jogada sozinha
  let tique = null;            // o relógio da regra "contra o relógio"
  let ultimoAlerta = -1;
  const elDaPeca = new Map();  // id da peça → o elemento dela

  /* Duas fiadas de tijolo por casa, com meia peça de deslocamento: o
     desenho fecha nas bordas, e dois muros vizinhos viram uma parede só. */
  const MURO = (() => {
    let tijolos = '';
    for (let fiada = 0; fiada < 4; fiada++) {
      for (let x = fiada % 2 ? -10 : 0; x < 40; x += 20) {
        tijolos += `<rect x="${x + 1}" y="${fiada * 10 + 1}" width="18" height="8" rx="1.2" ` +
          `fill="${(fiada + x / 10) % 3 ? '#b4583c' : '#a24c33'}"/>`;
      }
    }
    return `<svg viewBox="0 0 40 40" preserveAspectRatio="none" aria-hidden="true">` +
      `<rect width="40" height="40" fill="#5a2c20"/>${tijolos}</svg>`;
  })();

  const jogarCampanha = n => comecar({ tipo: 'campanha', nivel: NIVEIS[n], indice: n });
  const jogarDiario = () => comecar({ tipo: 'diario', nivel: nivelDoDia() });
  function jogarLivre() {
    const lista = RESERVA[salvo.livre.dif];
    let sorteado;
    do sorteado = lista[Math.floor(Math.random() * lista.length)];
    while (partida && partida.tipo === 'livre' && lista.length > 1 && sorteado[0] === partida.nivel.chave);
    comecar({
      tipo: 'livre', nivel: nivelAvulso(sorteado[0], sorteado[1]),
      dif: salvo.livre.dif, regra: salvo.livre.regra === 'livre' ? null : salvo.livre.regra
    });
  }

  /** Para tudo o que anda sozinho numa partida: relógio, solução, pedido ao resolvedor. */
  function pararPartida() {
    clearInterval(tique);
    tique = null;
    if (assistindo) clearTimeout(assistindo.espera);
    assistindo = null;
    pedido++;
    pensando = false;
    gravar();
  }

  function comecar(p) {
    pararPartida();
    partida = p;
    nivel = p.nivel;
    estado = M.criar(nivel);
    historico = [];
    escolhida = null;
    ultimo = null;
    arrasto = null;
    desfezAlgum = false;
    usouDica = false;
    comecou = 0;
    acabou = false;
    caminho = null;
    dicaNaTela = null;
    recado = '';
    passoDoTutorial = null;
    if (p.tipo === 'campanha') {
      mundoAtual = nivel.mundo;
      salvo.atual = nivel.chave;
      gravar();
    }

    mostrar('jogo');
    vestirPartida();
    montar();
    medir();
    desenhar();

    if (p.regra === 'tempo') tique = setInterval(conferirRelogio, 250);
    if (p.tipo === 'campanha' && p.indice === 0 && !salvo.tutorial) {
      passoDoTutorial = 0;
      guiar();
    }
  }

  /** Tudo o que na tela do jogo é texto ou cor, e muda com o idioma ou o visual. */
  function vestirPartida() {
    const p = partida;
    pintar($('telaJogo'), coresDoTabuleiro(p.tipo === 'campanha' ? nivel.mundo : 0));
    elPecas.className = 'pecas visual-' + salvo.visual.pecas;
    if (p.tipo === 'campanha') {
      $('jogoMundo').textContent = nomeDoMundo(nivel.mundo);
      $('jogoNivel').textContent = t('nivelDe', { a: nivel.numero, b: POR_MUNDO });
    } else if (p.tipo === 'diario') {
      $('jogoMundo').textContent = t('diario');
      $('jogoNivel').textContent = dataCurta();
    } else if (p.tipo === 'livre') {
      $('jogoMundo').textContent = t('livre');
      $('jogoNivel').textContent = t(p.dif) + (p.regra ? ' · ' + t(p.regra === 'tempo' ? 'regraTempo' : 'regraLances') : '');
    } else {
      $('jogoMundo').textContent = t('ondeDesafio');
      $('jogoNivel').textContent = '';
    }
    $('minimo').textContent = nivel.minimo;
    $('metas').innerHTML = t('metas', { a: nivel.estrelas[0], b: nivel.estrelas[1] });
    $('etapaPeaoTexto').textContent = t('etapaPeao', { n: estado.alt });
    $('etapaDamaTexto').textContent = t('etapaDama', { casa: nivel.alvo });
    elGrade.querySelectorAll('.daLargada').forEach(el => { el.textContent = t('largada'); });
    elGrade.querySelectorAll('.daChegada').forEach(el => { el.textContent = t('chegada'); });
  }

  function montar() {
    elGrade.innerHTML = '';
    elPecas.innerHTML = '';
    elDaPeca.clear();
    elTab.style.setProperty('--larg', estado.larg);

    /* A SAÍDA E A CHEGADA, como em pista de jogo. A saída é a casa de onde
       o peão parte: setas subindo. A chegada é a casa da DAMA — o fim do
       nível, e não a casa da coroação: é lá que a moldura quadriculada de
       bandeira fica, em volta da sombra da dama. */
    const largada = estado.casas.findIndex(p => p && p.heroi);

    estado.casas.forEach((p, i) => {
      const lin = Math.floor(i / estado.larg), col = i % estado.larg;
      const casa = document.createElement('div');
      /* a1 é sempre escura, seja qual for a altura do tabuleiro */
      casa.className = 'casa' + ((estado.alt - 1 - lin + col) % 2 ? ' clara' : '');

      if (p && p.muro) {
        casa.classList.add('muro');
        casa.innerHTML = MURO;
      }
      if (i === estado.alvo) {
        casa.appendChild(marca('chegada', ''));
        casa.appendChild(marca('alvo', '<img src="' + arquivoDaPeca('Q') + '" alt="">'));
        casa.appendChild(marca('placa daChegada', t('chegada')));
      }
      if (i === largada) {
        casa.appendChild(marca('largada', '<i></i><i></i><i></i>'));
        casa.appendChild(marca('placa daLargada', t('largada')));
      }
      if (col === 0) casa.appendChild(coordenada('fila', estado.alt - lin));
      if (lin === estado.alt - 1) casa.appendChild(coordenada('coluna', 'abcdefgh'[col]));
      elGrade.appendChild(casa);

      if (p && !p.muro) {
        const peca = document.createElement('div');
        peca.className = 'peca chegando';
        const img = peca.appendChild(document.createElement('img'));
        img.alt = '';
        /* As peças chegam em onda, de cima para baixo: é meio segundo, e é
           o que separa "o nível trocou" de "a tela piscou". */
        img.style.animationDelay = (lin * 45 + col * 25) + 'ms';
        img.addEventListener('animationend', () => peca.classList.remove('chegando'), { once: true });
        elPecas.appendChild(peca);
        elDaPeca.set(p.id, peca);
      }
    });
  }

  function marca(classe, miolo) {
    const m = document.createElement('div');
    m.className = classe;
    m.innerHTML = miolo;
    return m;
  }

  function coordenada(classe, texto) {
    const s = document.createElement('span');
    s.className = 'coord ' + classe;
    s.textContent = texto;
    return s;
  }

  /* A CASA EM PIXEL INTEIRO, como no kit: com fração, cada casa arredonda
     para um lado e aparece filete entre elas. */
  function medir() {
    if (!estado) return;
    /* Em pé, o tabuleiro divide a ALTURA com a barra, as etapas e o painel
       (uns 400 px, contando uma linha de recado); deitado, eles vão para o
       lado e o que ele divide é a largura. */
    const largura = deitado.matches ? window.innerWidth * 0.5 : Math.min(window.innerWidth - 24, 520);
    const altura = deitado.matches ? window.innerHeight - 30 : window.innerHeight - 400;
    const casa = Math.max(44, Math.floor(Math.min(largura / estado.larg, altura / estado.alt)));
    elTab.style.setProperty('--casa', casa + 'px');
  }

  const relogioEscrito = segundos => Math.floor(segundos / 60) + ':' + doisDigitos(segundos % 60);
  const segundosRestantes = () =>
    (comecou ? Math.max(0, Math.ceil(tempoDoNivel(nivel) - (Date.now() - comecou) / 1000)) : tempoDoNivel(nivel));

  /** A frase da faixa de recado, pela ordem de quem tem mais pressa de ser lido. */
  function recadoAgora() {
    if (assistindo) {
      return assistindo.fim ? t('solucaoFim', { n: assistindo.lances.length })
        : assistindo.lances ? t('solucao', { a: assistindo.i, b: assistindo.lances.length }) : t('pensando');
    }
    if (pensando) return t('pensando');
    if (recado) return recado;
    if (partida.regra === 'tempo') return t('tempoResta', { t: relogioEscrito(segundosRestantes()) });
    if (partida.regra === 'lances') return t('lancesRestam', { n: Math.max(0, lancesDoNivel(nivel) - estado.lances) });
    if (partida.tipo === 'desafio') return t('desafioMeta', { n: partida.meta });
    return '';
  }

  function desenhar() {
    const destinos = escolhida === null ? [] : M.destinos(estado, escolhida);

    [...elGrade.children].forEach((casa, i) => {
      casa.classList.toggle('escolhida', i === escolhida);
      casa.classList.toggle('pode', destinos.includes(i));
      casa.classList.toggle('veio', !!ultimo && ultimo.de === i);
      casa.classList.toggle('foi', !!ultimo && ultimo.para === i);
      casa.classList.toggle('dicaDe', !!dicaNaTela && dicaNaTela.de === i);
      casa.classList.toggle('dicaPara', !!dicaNaTela && dicaNaTela.para === i);
    });

    estado.casas.forEach((p, i) => {
      if (!p || p.muro) return;
      const el = elDaPeca.get(p.id);
      /* O tipo é conferido a cada desenho porque ele muda nos dois
         sentidos: o peão vira dama, e o desfazer devolve o peão. */
      if (el.dataset.tipo !== p.tipo) {
        el.dataset.tipo = p.tipo;
        el.firstChild.src = pecaDoTabuleiro(p.tipo);
      }
      el.classList.toggle('heroi', !!p.heroi);
      el.classList.toggle('apontada', !!dicaNaTela && dicaNaTela.de === i);
      if (arrasto && arrasto.ativo && arrasto.id === p.id) return;
      const lin = Math.floor(i / estado.larg), col = i % estado.larg;
      el.style.transform = `translate(calc(var(--casa) * ${col}), calc(var(--casa) * ${lin}))`;
    });

    elTab.classList.toggle('promovido', estado.promovido);
    $('etapaPeao').className = estado.promovido ? 'feita' : 'atual';
    $('etapaDama').className = estado.venceu ? 'feita' : estado.promovido ? 'atual' : '';

    const frase = recadoAgora();
    $('recado').hidden = !frase;
    $('recado').textContent = frase;
    $('recado').classList.toggle('urgente',
      !assistindo && !recado && !pensando && partida.regra === 'tempo' && !!comecou && segundosRestantes() <= 10);

    const reg = registroDe(nivel);
    $('lances').textContent = estado.lances;
    $('lances').classList.toggle('acima', estado.lances > nivel.estrelas[0]);
    $('melhor').textContent = reg.melhor || '—';
    const parado = estado.venceu || acabou;
    $('desfazer').disabled = !historico.length || parado;
    $('reiniciar').disabled = !historico.length && !acabou;
    $('dica').disabled = parado || pensando;
    $('botoesJogo').hidden = !!assistindo;
    $('botoesSolucao').hidden = !assistindo;
  }

  /* --------------------------------------------------------------- lances */

  function jogar(de, para) {
    const antes = M.copiar(estado);
    const r = M.mover(estado, de, para);
    if (!r.ok) return;
    if (!comecou) comecou = Date.now();
    historico.push({ estado: antes, ultimo });
    ultimo = { de, para };
    escolhida = null;
    salvo.estat.lances++;
    pedido++;
    pensando = false;

    /* Se o lance foi o que a solução guardada previa, ela continua valendo
       um passo adiante; se não foi, joga-se fora. */
    const seguiu = !!caminho && caminho.length > 0 && caminho[0][0] === de && caminho[0][1] === para;
    caminho = seguiu ? caminho.slice(1) : null;
    const eraADica = !!dicaNaTela && dicaNaTela.de === de && dicaNaTela.para === para;
    dicaNaTela = null;
    recado = '';

    if (passoDoTutorial !== null) {
      if (eraADica && ++passoDoTutorial < 3) guiar();
      else {
        if (eraADica) recado = t('tutFim');
        passoDoTutorial = null;
        salvo.tutorial = true;
      }
    }

    desenhar();
    Som.tocar('mover');
    vibrar(8);
    if (r.promoveu) {
      animar(elDaPeca.get(estado.casas[para].id), 'coroada');
      setTimeout(() => Som.tocar('coroar'), 120);
    }
    if (r.venceu) {
      /* A vitória é ANOTADA na hora do lance; só a festa espera a peça
         chegar. Quem sai da tela nesse meio segundo não perde o nível. */
      const dados = anotarVitoria(), esta = pedido;
      setTimeout(() => { if (esta === pedido) festejar(dados); }, 520);
    }
    else if (partida.regra === 'lances' && estado.lances >= lancesDoNivel(nivel)) perder('lances');
  }

  function desfazer() {
    if (!historico.length || estado.venceu || acabou || assistindo) return;
    const passo = historico.pop();
    estado = passo.estado;
    ultimo = passo.ultimo;
    escolhida = null;
    desfezAlgum = true;
    caminho = null;
    dicaNaTela = null;
    recado = '';
    pedido++;
    pensando = false;
    Som.tocar('desfazer');
    desenhar();
  }

  function animar(el, classe) {
    el.classList.remove(classe);
    void el.offsetWidth;                       // recomeça a animação se ela já estava lá
    el.classList.add(classe);
    el.addEventListener('animationend', () => el.classList.remove(classe), { once: true });
  }

  /* ------------------------------------------------- a dica e o tutorial

     Os dois perguntam a mesma coisa ao resolvedor — "qual é o próximo
     lance do caminho mais curto?" — e mostram a resposta do mesmo jeito:
     a peça e a casa brilhando. A diferença é que a dica custa uma estrela
     e o tutorial não custa nada. */

  /** O próximo lance bom: [de, para]; `null` se não deu para calcular; `undefined` se a posição mudou no meio. */
  async function proximoLance() {
    if (caminho && caminho.length) return caminho[0];
    const meu = ++pedido;
    pensando = true;
    desenhar();
    const r = await R.pedir(estado);
    if (meu !== pedido) return undefined;
    pensando = false;
    if (r && r.lances && r.lances.length) {
      caminho = r.lances;
      return caminho[0];
    }
    return null;
  }

  async function pedirDica() {
    if (estado.venceu || acabou || assistindo || pensando) return;
    const lance = await proximoLance();
    if (lance === undefined) return;
    if (lance) {
      /* O preço é dito uma vez por nível, na primeira dica — e num aviso que
         some, para a faixa de recado caber numa linha no telefone. */
      if (!usouDica) avisar(t('dicaCusto'));
      usouDica = true;
      salvo.estat.dicas++;
      dicaNaTela = { de: lance[0], para: lance[1] };
      recado = t('dicaMostra');
      escolhida = null;
      Som.tocar('dica');
    } else {
      recado = t('dicaLonge');
    }
    desenhar();
  }

  async function guiar() {
    const passo = passoDoTutorial;
    const lance = await proximoLance();
    if (lance === undefined || passoDoTutorial !== passo) return;
    if (!lance) { passoDoTutorial = null; desenhar(); return; }
    dicaNaTela = { de: lance[0], para: lance[1] };
    recado = t('tut' + (passo + 1));
    desenhar();
  }

  /* ------------------------------------------------------ ver a solução */

  async function assistir() {
    pararPartida();
    $('vitoria').hidden = true;
    estado = M.criar(nivel);
    historico = [];
    escolhida = null;
    ultimo = null;
    dicaNaTela = null;
    recado = '';
    acabou = false;
    const meu = assistindo = { i: 0 };
    montar();
    medir();
    desenhar();
    const r = await R.pedir(estado);
    if (assistindo !== meu) return;
    if (!r || !r.lances) { sairDaSolucao(); return; }
    meu.lances = r.lances;
    meu.espera = setTimeout(passoDaSolucao, 700);
    desenhar();
  }

  function passoDaSolucao() {
    const a = assistindo;
    if (!a) return;
    if (a.i >= a.lances.length) { a.fim = true; desenhar(); return; }
    const [de, para] = a.lances[a.i++];
    const r = M.mover(estado, de, para);
    ultimo = { de, para };
    desenhar();
    Som.tocar('mover');
    if (r.promoveu) {
      animar(elDaPeca.get(estado.casas[para].id), 'coroada');
      setTimeout(() => Som.tocar('coroar'), 120);
    }
    a.espera = setTimeout(passoDaSolucao, 640);
  }

  const sairDaSolucao = () => comecar(partida);

  /* ------------------------------------------------- o fim: vitória e derrota */

  function conferirRelogio() {
    if (!comecou || estado.venceu || acabou || assistindo) return;
    const resta = segundosRestantes();
    if (resta <= 10 && resta > 0 && resta !== ultimoAlerta) Som.tocar('alerta');
    ultimoAlerta = resta;
    if (resta <= 0) perder('tempo');
    else if (!recado && !pensando) {
      $('recado').textContent = recadoAgora();
      $('recado').classList.toggle('urgente', resta <= 10);
    }
  }

  function perder(motivo) {
    if (estado.venceu || acabou) return;
    acabou = true;
    clearInterval(tique);
    tique = null;
    escolhida = null;
    dicaNaTela = null;
    recado = '';
    desenhar();
    Som.tocar('perder');
    vibrar([60, 80, 60]);

    $('estrelas').innerHTML = '<span class="sem">⌛</span>';
    $('vitoriaTitulo').textContent = t(motivo === 'tempo' ? 'derrotaTempo' : 'derrotaLances');
    $('vitoriaTexto').textContent = t('derrotaTexto');
    $('vitoriaRecorde').hidden = true;
    $('vitoriaExtras').hidden = true;
    $('vitoriaSair').textContent = t('sair');
    $('deNovo').textContent = t('tentar');
    $('proximo').textContent = t('outro');
    $('proximo').hidden = false;
    $('vitoria').hidden = false;
  }

  /** Guarda tudo o que a vitória muda. Devolve o que a festa precisa saber. */
  function anotarVitoria() {
    clearInterval(tique);
    tique = null;
    const p = partida;
    const reg = Object.assign({}, registroDe(nivel));
    const primeiraVez = !reg.melhor;
    const naCampanha = p.tipo === 'campanha';
    const abertosAntes = MUNDOS.map((_, m) => mundoAberto(m));
    const visuaisAntes = visuaisLiberados();
    const mundoEstavaCompleto = naCampanha && feitosNoMundo(nivel.mundo) === POR_MUNDO;
    /* Com dica, três estrelas não: a terceira é de quem achou o caminho. */
    const estrelas = Math.min(usouDica ? 2 : 3, estrelasDe(nivel, estado.lances));
    const recorde = !primeiraVez && estado.lances < reg.melhor;

    if (primeiraVez || recorde) { reg.melhor = estado.lances; reg.comDica = usouDica; }
    else if (estado.lances === reg.melhor && !usouDica) reg.comDica = false;
    reg.estrelas = Math.max(reg.estrelas || 0, estrelas);
    reg.vitorias = (reg.vitorias || 0) + 1;
    salvo.niveis[nivel.chave] = reg;

    const e = salvo.estat;
    e.vitorias++;
    if (recorde) e.recordes++;
    if (!desfezAlgum) e.semDesfazer++;
    if (comecou && Date.now() - comecou < 60000) e.rapidas++;
    if (p.tipo === 'livre') e.livres++;
    if (p.regra === 'tempo') e.relogio++;
    if (p.tipo === 'diario') {
      const doDia = salvo.diario[hoje()];
      if (!doDia) e.diarios++;
      if (!doDia || estado.lances < doDia.lances) salvo.diario[hoje()] = { lances: estado.lances, estrelas };
    }
    registrarDia();
    conferirConquistas();
    gravar();

    const completouMundo = naCampanha && !mundoEstavaCompleto && feitosNoMundo(nivel.mundo) === POR_MUNDO;
    const abriu = MUNDOS.findIndex((_, m) => !abertosAntes[m] && mundoAberto(m));
    const zerou = naCampanha && primeiraVez && nivel.id <= NA_CAMPANHA && resumo().campanha === NA_CAMPANHA;
    visuaisLiberados().filter(v => !visuaisAntes.includes(v)).forEach((v, i) =>
      setTimeout(() => avisar('🎨 ' + t('temaAviso', { nome: t(v) })), 2600 + i * 1200));
    return { estrelas, recorde, completouMundo, abriu, zerou };
  }

  /** O cartão da vitória, com as estrelas, o confete e os botões do que vem depois. */
  function festejar({ estrelas, recorde, completouMundo, abriu, zerou }) {
    const p = partida, naCampanha = p.tipo === 'campanha';
    $('vitoriaTitulo').textContent =
      zerou ? t('zerou')
      : p.tipo === 'desafio' ? t(estado.lances < p.meta ? 'desafioVencido' : estado.lances === p.meta ? 'desafioEmpate' : 'desafioPerdido', { n: p.meta })
      : p.tipo === 'diario' ? t('diarioConcluido')
      : completouMundo ? t('mundoCompleto', { mundo: nomeDoMundo(nivel.mundo) })
      : abriu >= 0 ? t('novoMundo', { mundo: nomeDoMundo(abriu) })
      : t('nivelConcluido');
    $('vitoriaTexto').innerHTML = estado.lances <= nivel.minimo
      ? t('resolvidoMin', { n: estado.lances })
      : t('resolvido', { n: estado.lances, m: nivel.minimo });
    $('vitoriaRecorde').hidden = !recorde && !usouDica;
    $('vitoriaRecorde').textContent = recorde ? t('novoRecorde') : t('comDica');
    $('estrelas').innerHTML = [1, 2, 3].map(n => `<span class="${n <= estrelas ? 'acesa' : ''}">★</span>`).join('');
    $('vitoriaExtras').hidden = false;
    $('vitoriaSair').textContent = naCampanha ? t('niveis') : t('sair');
    $('deNovo').textContent = t('deNovo');
    $('proximo').textContent = p.tipo === 'livre' ? t('outro') : t('proximo');
    $('proximo').hidden = p.tipo === 'livre' ? false : !naCampanha || proximoDepoisDe(p.indice) < 0;
    $('vitoria').hidden = false;
    desenhar();

    Som.tocar('vencer');
    vibrar([20, 60, 20, 60, 50]);
    for (let i = 0; i < estrelas; i++) setTimeout(() => Som.tocar('estrela'), 650 + i * 150);
    confete(completouMundo || abriu >= 0 || zerou ? 150 : estrelas === 3 ? 80 : 40);
  }

  /** As chaves de texto dos visuais que as estrelas de agora já liberam. */
  function visuaisLiberados() {
    const estrelas = totalDeEstrelas();
    return VISUAIS.pecas.filter(v => estrelas >= v.estrelas).map(v => 'pecas.' + v.id)
      .concat(VISUAIS.tabuleiros.filter(v => estrelas >= v.estrelas).map(v => 'tab.' + v.id));
  }

  /** O nível seguinte que está aberto, ou -1 se não há para onde ir. */
  function proximoDepoisDe(n) {
    if (n + 1 < NIVEIS.length && nivelAberto(n + 1)) return n + 1;
    return NIVEIS.findIndex((_, i) => !feito(i) && nivelAberto(i));
  }

  function confete(quantos) {
    if (semMovimento.matches) return;
    const cores = ['#ffc43c', '#ff7a59', '#6ee7b7', '#7cc4ff', '#f0abfc', '#ffffff'];
    const caixa = $('confete');
    for (let i = 0; i < quantos; i++) {
      const p = document.createElement('i');
      p.style.background = cores[i % cores.length];
      p.style.left = (50 + (Math.random() - 0.5) * 30) + '%';
      caixa.appendChild(p);
      const dx = (Math.random() - 0.5) * window.innerWidth * 0.9;
      const sobe = -(120 + Math.random() * 260);
      p.animate([
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${dx * 0.6}px,${sobe}px) rotate(${Math.random() * 360}deg)`, opacity: 1, offset: 0.35 },
        { transform: `translate(${dx}px,${window.innerHeight * 0.7}px) rotate(${Math.random() * 1080}deg)`, opacity: 0 }
      ], { duration: 1500 + Math.random() * 1300, easing: 'cubic-bezier(.2,.6,.4,1)', delay: Math.random() * 180 })
        .onfinish = () => p.remove();
    }
  }

  /* ------------------------------------------- compartilhar e desafiar

     O resultado sai como TEXTO com o endereço do jogo: é o que cabe em
     qualquer conversa. No telefone abre a folha de compartilhar do
     aparelho; onde ela não existe, o texto vai para a área de
     transferência e um aviso diz que é só colar.

     O DESAFIO é o mesmo texto com um pedaço a mais no endereço —
     `#d=<nível>-<lances>` — que faz o jogo abrir direto naquele nível,
     com a marca a bater. */

  function ondeEstou() {
    const p = partida;
    if (p.tipo === 'campanha') return t('onde', { mundo: nomeDoMundo(nivel.mundo), n: nivel.numero });
    if (p.tipo === 'diario') return t('ondeDiario', { data: dataCurta() });
    if (p.tipo === 'livre') return t('ondeLivre', { dif: t(p.dif) });
    return t('ondeDesafio');
  }

  /* Aberto do disco não há endereço que sirva para outra pessoa. */
  const endereco = () => (location.protocol.startsWith('http') ? location.href.split('#')[0] : '');

  async function enviar(texto) {
    if (navigator.share) {
      try { await navigator.share({ text: texto }); return; }
      catch (erro) { if (erro && erro.name === 'AbortError') return; }
    }
    try {
      await navigator.clipboard.writeText(texto);
      avisar(t('copiado'));
    } catch {
      const caixa = document.createElement('textarea');       // o jeito antigo, para onde o novo é barrado
      caixa.value = texto;
      document.body.appendChild(caixa);
      caixa.select();
      let deu = false;
      try { deu = document.execCommand('copy'); } catch { /* fica sem copiar */ }
      caixa.remove();
      avisar(t(deu ? 'copiado' : 'naoCopiou'));
    }
  }

  function compartilhar() {
    const estrelas = '★'.repeat(Math.min(usouDica ? 2 : 3, estrelasDe(nivel, estado.lances)));
    const texto = t('textoCompartilhar', { onde: ondeEstou(), n: estado.lances, estrelas });
    enviar(endereco() ? texto + '\n' + endereco() : texto);
  }

  function desafiar() {
    const codigo = nivel.id ? 'c' + nivel.id : 'p' + nivel.chave;
    const texto = t('textoDesafio', { onde: ondeEstou(), n: estado.lances });
    enviar(endereco() ? `${texto}\n${endereco()}#d=${codigo}-${estado.lances}` : texto);
  }

  /** Se o endereço traz um desafio, abre nele. Devolve se abriu. */
  function abrirDesafioDoEndereco() {
    const achou = /^#d=(?:c(\d+)|p([NBR]{12}))-(\d+)$/.exec(location.hash);
    if (!achou) return false;
    try { history.replaceState(null, '', location.pathname + location.search); } catch { /* fica o # */ }
    const meta = Number(achou[3]);
    if (achou[1]) {
      const nv = NIVEIS[Number(achou[1]) - 1];
      if (!nv) return false;
      comecar({ tipo: 'desafio', nivel: nv, meta });
      return true;
    }
    for (const faixa in RESERVA) {
      const daReserva = RESERVA[faixa].find(par => par[0] === achou[2]);
      if (daReserva) { comecar({ tipo: 'desafio', nivel: nivelAvulso(daReserva[0], daReserva[1]), meta }); return true; }
    }
    return false;
  }

  /* ------------------------------------------------------- o dedo e o mouse

     Um gesto só serve aos dois jeitos de jogar. Tocar numa peça a ESCOLHE;
     se o dedo andar com ela, virou arrasto, e largar numa casa marcada faz
     o lance. Se o dedo não andou, a peça fica escolhida e o toque seguinte
     numa casa marcada é que faz o lance. */

  function indiceEm(x, y) {
    const r = elGrade.getBoundingClientRect();
    const casa = r.width / estado.larg;
    const col = Math.floor((x - r.left) / casa), lin = Math.floor((y - r.top) / casa);
    if (col < 0 || lin < 0 || col >= estado.larg || lin >= estado.alt) return -1;
    return lin * estado.larg + col;
  }

  elTab.addEventListener('pointerdown', e => {
    if (estado.venceu || acabou || assistindo || e.button > 0 || arrasto) return;
    const i = indiceEm(e.clientX, e.clientY);
    if (i < 0) return;
    const p = estado.casas[i];

    if (p && !p.muro) {
      const el = elDaPeca.get(p.id);
      if (!M.destinos(estado, i).length) {
        escolhida = null;
        animar(el, 'presa');
        Som.tocar('preso');
        vibrar([12, 40, 12]);
      } else {
        arrasto = { id: p.id, de: i, el, x0: e.clientX, y0: e.clientY, ativo: false, jaEra: escolhida === i,
          toque: e.pointerType === 'touch' };
        escolhida = i;
        try { elTab.setPointerCapture(e.pointerId); } catch { /* ponteiro já solto: segue sem captura */ }
      }
      desenhar();
    } else if (escolhida !== null && M.destinos(estado, escolhida).includes(i)) {
      jogar(escolhida, i);
    } else {
      escolhida = null;
      desenhar();
    }
  });

  elTab.addEventListener('pointermove', e => {
    if (!arrasto) return;
    if (!arrasto.ativo) {
      if (Math.hypot(e.clientX - arrasto.x0, e.clientY - arrasto.y0) < 6) return;
      arrasto.ativo = true;
      arrasto.el.classList.add('naMao');
    }
    const r = elGrade.getBoundingClientRect();
    const meia = r.width / estado.larg / 2;
    /* NO DEDO A PEÇA SOBE E CRESCE: embaixo do dedo ela some, e arrastar o
       que não se vê é chute. A casa que vale continua sendo a do dedo — e
       por isso ela acende, para não haver dúvida de onde a peça vai cair. */
    const sobe = arrasto.toque ? meia * 1.5 : 0;
    arrasto.el.style.transform =
      `translate(${e.clientX - r.left - meia}px, ${e.clientY - r.top - meia - sobe}px) scale(${arrasto.toque ? 1.45 : 1.12})`;
    mirar(indiceEm(e.clientX, e.clientY));
  });

  /** Acende a casa de destino que está debaixo do dedo durante o arrasto. */
  function mirar(i) {
    const vale = !!arrasto && M.destinos(estado, arrasto.de).includes(i);
    [...elGrade.children].forEach((casa, k) => casa.classList.toggle('mirada', vale && k === i));
  }

  function soltar(e, cancelado) {
    const a = arrasto;
    if (!a) return;
    arrasto = null;
    mirar(-1);
    a.el.classList.remove('naMao');
    if (a.ativo) {
      const i = cancelado ? -1 : indiceEm(e.clientX, e.clientY);
      if (M.destinos(estado, a.de).includes(i)) jogar(a.de, i);
      else desenhar();                          // volta deslizando para casa
    } else if (a.jaEra) {
      escolhida = null;                         // tocar de novo na escolhida solta
      desenhar();
    }
  }
  elTab.addEventListener('pointerup', e => soltar(e, false));
  elTab.addEventListener('pointercancel', e => soltar(e, true));

  /* ============================================================ os ajustes */

  function aplicarAjustes() {
    Som.ligar(salvo.som);
    Som.musica(salvo.musica);
    $('chaveSom').checked = salvo.som;
    $('chaveMusica').checked = salvo.musica;
    $('chaveVibracao').checked = salvo.vibrar;
    $('chaveIdioma').value = salvo.idioma;
  }

  function trocarIdioma(lingua) {
    salvo.idioma = lingua;
    gravar();
    Texto.usar(lingua);
    Texto.vestir();
    const tela = document.body.dataset.tela;
    if (tela === 'jogo') { vestirPartida(); desenhar(); }
    else mostrar(tela);
  }

  $('chaveIdioma').innerHTML = Object.keys(Texto.NOMES).map(l => `<option value="${l}">${Texto.NOMES[l]}</option>`).join('');
  $('linhaVibracao').hidden = !navigator.vibrate;
  $('notaIOS').hidden = !(/iphone|ipad|ipod/i.test(navigator.userAgent) && !navigator.standalone);

  $('chaveSom').addEventListener('change', e => { salvo.som = e.target.checked; gravar(); aplicarAjustes(); Som.tocar('clique'); });
  $('chaveMusica').addEventListener('change', e => { salvo.musica = e.target.checked; gravar(); aplicarAjustes(); });
  $('chaveVibracao').addEventListener('change', e => { salvo.vibrar = e.target.checked; gravar(); vibrar(20); });
  $('chaveIdioma').addEventListener('change', e => trocarIdioma(e.target.value));
  $('apagar').addEventListener('click', () => {
    if (!window.confirm(t('apagarConfirma'))) return;
    try { localStorage.removeItem(CHAVE); localStorage.removeItem(CHAVE_ANTIGA); } catch { /* nada a apagar */ }
    location.reload();
  });
  document.querySelectorAll('.abrirAjustes').forEach(b => b.addEventListener('click', () => { $('ajustes').hidden = false; }));
  $('fecharAjustes').addEventListener('click', () => { $('ajustes').hidden = true; });
  $('irComoJogar').addEventListener('click', () => { $('comoJogar').hidden = false; });
  $('fecharComoJogar').addEventListener('click', () => { $('comoJogar').hidden = true; });
  /* tocar fora do cartão fecha os dois */
  ['ajustes', 'comoJogar'].forEach(id => $(id).addEventListener('click', e => { if (e.target === $(id)) $(id).hidden = true; }));

  /* ============================================================ os botões */

  $('jogar').addEventListener('click', () => jogarCampanha(nivelParaContinuar()));
  $('irDiario').addEventListener('click', jogarDiario);
  $('irLivre').addEventListener('click', () => mostrar('livre'));
  $('irMundos').addEventListener('click', () => mostrar('mundos'));
  $('irConquistas').addEventListener('click', () => mostrar('conquistas'));
  $('irAparencia').addEventListener('click', () => mostrar('aparencia'));
  $('irEstatisticas').addEventListener('click', () => mostrar('estatisticas'));

  $('mundosLista').addEventListener('click', e => {
    const botao = e.target.closest('button[data-m]');
    if (!botao || botao.disabled) return;
    mundoAtual = Number(botao.dataset.m);
    mostrar('niveis');
  });
  $('niveisLista').addEventListener('click', e => {
    const botao = e.target.closest('button[data-n]');
    if (botao && !botao.disabled) jogarCampanha(Number(botao.dataset.n));
  });

  $('telaLivre').addEventListener('click', e => {
    const botao = e.target.closest('button[data-dif], button[data-regra]');
    if (!botao) return;
    if (botao.dataset.dif) salvo.livre.dif = botao.dataset.dif;
    else salvo.livre.regra = botao.dataset.regra;
    gravar();
    desenharLivre();
  });
  $('livreComecar').addEventListener('click', jogarLivre);

  $('telaAparencia').addEventListener('click', e => {
    const botao = e.target.closest('button[data-lista]');
    if (!botao || botao.disabled) return;
    salvo.visual[botao.dataset.lista === 'pecas' ? 'pecas' : 'tabuleiro'] = botao.dataset.id;
    gravar();
    desenharAparencia();
  });

  /* De onde se veio é para onde se volta. */
  const saida = () => (partida.tipo === 'campanha' ? 'niveis' : partida.tipo === 'livre' ? 'livre' : 'inicio');
  $('sairDoJogo').addEventListener('click', () => mostrar(saida()));
  $('vitoriaSair').addEventListener('click', () => mostrar(saida()));

  $('desfazer').addEventListener('click', desfazer);
  $('reiniciar').addEventListener('click', () => comecar(partida));
  $('dica').addEventListener('click', pedirDica);
  $('deNovo').addEventListener('click', () => comecar(partida));
  $('proximo').addEventListener('click', () => {
    if (partida.tipo === 'livre') { jogarLivre(); return; }
    const n = proximoDepoisDe(partida.indice);
    if (n >= 0) jogarCampanha(n);
  });
  $('compartilhar').addEventListener('click', compartilhar);
  $('desafiar').addEventListener('click', desafiar);
  $('verSolucao').addEventListener('click', assistir);
  $('sairSolucao').addEventListener('click', sairDaSolucao);

  document.querySelectorAll('.voltar[data-para]').forEach(b =>
    b.addEventListener('click', () => mostrar(b.dataset.para)));

  /* Todo botão que não é do tabuleiro faz o mesmo clique. */
  document.addEventListener('click', e => {
    if (e.target.closest('button') && !e.target.closest('#desfazer, #dica')) Som.tocar('clique');
  });
  /* A música só pode começar depois de um gesto: o primeiro toque a acorda. */
  document.addEventListener('pointerdown', () => Som.musica(salvo.musica), { once: true });

  document.addEventListener('keydown', e => {
    const tela = document.body.dataset.tela, noJogo = tela === 'jogo';
    if (e.key === 'Escape') {
      const aberto = ['ajustes', 'comoJogar'].find(id => !$(id).hidden);
      if (aberto) $(aberto).hidden = true;
      /* No jogo o Esc só solta a peça: sair de um nível pela metade por
         causa de uma tecla esbarrada custa caro demais. */
      else if (noJogo) { escolhida = null; desenhar(); }
      else if (tela === 'niveis') mostrar('mundos');
      else if (tela !== 'inicio') mostrar('inicio');
    } else if (!noJogo || assistindo) {
      return;
    } else if (e.key.toLowerCase() === 'z' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      desfazer();
    } else if (e.key.toLowerCase() === 'r' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      comecar(partida);
    }
  });

  window.addEventListener('resize', medir);
  deitado.addEventListener('change', medir);

  /* O TEMPO JOGADO conta só com o jogo na tela e a aba à vista. */
  setInterval(() => {
    if (document.body.dataset.tela !== 'jogo' || document.hidden) return;
    if (++salvo.estat.tempo % 20 === 0) gravar();
  }, 1000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) gravar(); });

  /* ------------------------------------------- instalar como aplicativo

     O navegador avisa quando o jogo PODE ser instalado; é só aí que o
     botão aparece. O serviço que deixa jogar sem internet (sw.js) só é
     ligado no arquivo empacotado: durante o desenvolvimento ele serviria
     arquivo velho. */
  let convite = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    convite = e;
    $('instalar').hidden = false;
  });
  $('instalar').addEventListener('click', () => {
    if (!convite) return;
    convite.prompt();
    convite = null;
    $('instalar').hidden = true;
  });
  if (window.SlideEmpacotado && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* sem o sw.js ao lado: joga só com internet */ });
  }

  /* ============================================================ a partida */

  Texto.usar(salvo.idioma);
  Texto.vestir();
  /* Quem chega com jogo salvo de uma versão sem conquistas recebe, calado,
     as que já tinha merecido. */
  if (conferirConquistas(true)) gravar();
  aplicarAjustes();
  if (!abrirDesafioDoEndereco()) mostrar('inicio');
})();
</script>
</body>
