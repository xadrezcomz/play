<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- compartilhar: imagem e texto do link (colocado por ferramentas/prepara-jogo.py) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Jogos do @xadrezcomz">
<meta property="og:locale" content="pt_BR">
<meta property="og:url" content="https://xadrezcomz.github.io/play/endless-pace/jogar/">
<meta property="og:title" content="Endless Pace — jogue grátis no navegador">
<meta property="og:description" content="Crie seu corredor e encontre o seu ritmo numa corrida que nunca termina. Grátis, no celular ou no computador.">
<meta property="og:image" content="https://xadrezcomz.github.io/play/img/capa-endless-pace.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Endless Pace: até onde você consegue correr?">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://xadrezcomz.github.io/play/img/capa-endless-pace.jpg">
<!-- /compartilhar -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Endless Pace</title>
<meta name="description" content="Crie seu corredor e encontre o seu ritmo numa corrida que nunca termina. Grátis, no celular ou no computador.">
<meta name="theme-color" content="#0f1d2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Endless Pace">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../fontes/fontes.css">
<link rel="stylesheet" href="estilo.css">
<!-- cada abertura do jogo conta como uma jogada (GoatCounter, sem cookies) -->
<script>window.CONTAGEM = '/jogo/endless-pace';</script>
<script src="../../contador.js"></script>
</head>
<body>
<div id="app">
  <canvas id="cena" aria-hidden="true"></canvas>
  <div id="toque" aria-hidden="true"></div>
  <div id="vinheta" aria-hidden="true"></div>
  <div id="flow-fx" aria-hidden="true"></div>

  <!-- HUD da corrida (GDD §65–66): pouco espaço, cenário sempre à vista -->
  <div id="hud" hidden>
    <div class="hud-topo">
      <div class="pil p-dist">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a7 7 0 0 0-7 7c0 5.2 7 12 7 12s7-6.8 7-12a7 7 0 0 0-7-7zm0 9.6a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2z"/></svg>
        <b id="h-dist">0 m</b>
      </div>
      <div class="pil p-vel">
        <svg class="ic raio" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 4.5 13.5h6L9.5 22l9-11.5h-6z"/></svg>
        <span class="pil-txt"><span class="rot" data-t="hud.speed"></span><b><span id="h-vel">4,0</span><small> km/h</small></b></span>
      </div>
      <div id="h-flow" class="pil p-flow">
        <svg class="ic chama" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.6 2.2c.5 3-1.6 4.6-3 6.3C8 10.4 7 12 7 14.3A5 5 0 0 0 12 19.5a5 5 0 0 0 5-5.2c0-1.6-.6-3-1.5-4.1-.2 1.4-1 2.4-2.1 2.6.8-3.1-.1-7.3-.8-10.6zM12 21.8a7.3 7.3 0 0 1-7.3-7.4c0-3.2 1.7-5.4 3.4-7.3-.2 1.4.2 2.6 1 3.4C10 6.8 11.3 4 11 1c4.4 2.3 8.3 7 8.3 13.3a7.3 7.3 0 0 1-7.3 7.5z"/></svg>
        <span class="pil-txt"><span class="rot">FLOW <em id="h-flow-n"></em></span><span class="segs"><i></i><i></i><i></i><i></i><i></i><s id="h-flow-bar"></s></span></span>
      </div>
      <button id="h-pausa" class="btn-pausa" type="button" data-t-aria="hud.pause"><span></span><span></span></button>
    </div>
    <div class="hud-linha">
      <span id="h-moedas" class="pil mini moedas"><i class="moeda"></i><b id="h-moedas-b">0</b></span>
      <span class="pil mini ultra"><span data-t="hud.overtakes"></span> <b id="h-ultra">0</b></span>
    </div>
    <div id="h-rota" class="rota" hidden></div>
    <div id="h-desafio" class="desafio" hidden>
      <div class="d-topo"><span class="d-rot" data-t="ch.label"></span><span id="h-d-tit"></span><span id="h-d-prog" class="d-prog"></span></div>
      <div id="h-d-desc" class="d-desc"></div>
      <div class="d-tempo"><i id="h-d-tempo"></i></div>
    </div>
    <div class="hud-centro">
      <div id="h-aval" class="aval"></div>
      <div id="h-combo" class="combo" hidden></div>
    </div>
    <div id="h-dica" class="dica" hidden><strong id="h-dica-t"></strong><span id="h-dica-s"></span></div>
    <div id="h-bif" class="bif" hidden>
      <div class="bif-tit" data-t="fork.title"></div>
      <div class="bif-cartoes">
        <div id="h-bif-e" class="cartao"></div>
        <div id="h-bif-d" class="cartao"></div>
      </div>
      <div class="bif-dica" data-t="fork.hint"></div>
    </div>
    <div id="h-aviso" class="aviso" aria-live="polite"></div>
    <div id="h-meta" class="meta-toast" hidden aria-live="polite"><span id="h-meta-ic" class="mt-ic"></span><span class="mt-txt"><small id="h-meta-rot"></small><b id="h-meta-txt"></b></span></div>
    <div class="hud-base">
      <div id="h-batida" class="batida"><i></i></div>
      <div id="h-zona" class="zona"></div>
      <div class="pil energia">
        <svg class="ic raio" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 4.5 13.5h6L9.5 22l9-11.5h-6z"/></svg>
        <span class="en-col"><span class="rot" data-t="hud.energy"></span><span class="barra"><i id="h-energia"></i></span></span>
        <b id="h-energia-pct">100%</b>
      </div>
    </div>
  </div>

  <!-- carregando -->
  <section id="tela-carregando" class="tela centro">
    <div class="logo grande"><span>ENDLESS</span><span>PACE</span></div>
    <p class="slogan" data-t="app.tagline"></p>
    <div class="carregando"><i></i></div>
    <p id="erro" class="erro" hidden></p>
  </section>

  <!-- criação do corredor (GDD §4) -->
  <section id="tela-criar" class="tela painel-lateral" hidden>
    <div class="painel">
      <div class="passos"><span id="c-passo"></span><div class="pontos"><i></i><i></i><i></i><i></i></div></div>
      <h1 class="tit" data-t="create.title"></h1>
      <div class="etapa" data-etapa="1">
        <h2 data-t="create.who"></h2>
        <div class="escolha-genero">
          <button type="button" class="opcao grande" data-genero="m" data-t="gender.m"></button>
          <button type="button" class="opcao grande" data-genero="f" data-t="gender.f"></button>
        </div>
      </div>
      <div class="etapa" data-etapa="2">
        <h2 data-t="create.nameTitle"></h2>
        <input id="c-nome" class="campo" type="text" maxlength="15" autocomplete="off" autocapitalize="characters" spellcheck="false" data-t-ph="create.namePh">
        <p class="nota" data-t="create.nameHint"></p>
      </div>
      <div class="etapa" data-etapa="3">
        <h2 data-t="create.looks"></h2>
        <div class="grupo"><span class="rot" data-t="create.skin"></span><div class="cores" id="c-pele"></div></div>
        <div class="grupo"><span class="rot" data-t="create.hairStyle"></span><div class="chips" id="c-cabelo"></div></div>
        <div class="grupo"><span class="rot" data-t="create.hairColor"></span><div class="cores" id="c-cor-cabelo"></div></div>
      </div>
      <div class="etapa" data-etapa="4">
        <h2 data-t="create.outfit"></h2>
        <p class="nota" data-t="create.outfitHint"></p>
        <div class="grupo"><span class="rot" data-t="create.shirt"></span><div class="cores" id="c-camiseta"></div></div>
        <div class="grupo"><span class="rot" data-t="create.shorts"></span><div class="cores" id="c-short"></div></div>
        <div class="grupo"><span class="rot" data-t="create.shoes"></span><div class="cores" id="c-tenis"></div></div>
      </div>
      <div class="acoes">
        <button type="button" id="c-voltar" class="btn sec" data-t="ui.back"></button>
        <button type="button" id="c-proximo" class="btn pri" data-t="ui.next"></button>
      </div>
    </div>
    <p class="girar" data-t="create.rotate"></p>
  </section>

  <!-- tela inicial (GDD §91): correr, loja e o resto do jogo à mão -->
  <section id="tela-inicio" class="tela" hidden>
    <header class="inicio-topo">
      <button type="button" id="i-perfil" class="chip-perfil" data-t-aria="home.profile">
        <span class="nivel"><small data-t="lvl.short"></small><b id="i-nivel">1</b></span>
        <span class="cp-txt">
          <span id="i-nome" class="cp-nome"></span>
          <span id="i-titulo" class="cp-titulo"></span>
          <span class="cp-xp"><i id="i-xp"></i></span>
          <span id="i-xp-txt" class="cp-xp-txt"></span>
        </span>
      </button>
      <div class="logo topo-logo"><span>ENDLESS</span><span>PACE</span></div>
      <span class="moedas pilula"><i class="moeda"></i><b id="i-moedas">0</b></span>
    </header>
    <div class="inicio-base">
      <div class="perfil">
        <div class="total"><b id="i-total">0 km</b> <span data-t="home.total"></span></div>
        <div id="i-melhor" class="melhor"></div>
      </div>
      <button type="button" id="i-correr" class="btn correr"><span data-t="home.run"></span></button>
      <nav class="menu-grade">
        <button type="button" id="i-loja" class="mb loja">
          <svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8L5 8z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></svg>
          <span class="mb-txt"><b data-t="home.shop"></b><small data-t="home.shopSub"></small></span>
          <em id="i-loja-selo" class="selo" hidden></em>
        </button>
        <button type="button" id="i-equipar" class="mb">
          <svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 3.5 3 6.5l2 4.2 2.6-1V20.5h8.8V9.7l2.6 1 2-4.2-5.5-3a3.5 3.5 0 0 1-7 0z"/></svg>
          <span class="mb-txt"><b data-t="home.equip"></b></span>
        </button>
        <button type="button" id="i-missoes" class="mb">
          <svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4V2.8h6V4"/><path d="m8.8 12.5 2.2 2.2 4.2-4.4"/></svg>
          <span class="mb-txt"><b data-t="home.missions"></b></span>
          <em id="i-missoes-selo" class="selo" hidden></em>
        </button>
        <button type="button" id="i-conquistas" class="mb">
          <svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3.5h8v5.5a4 4 0 0 1-8 0V3.5z"/><path d="M16 5h3v1.5a3.5 3.5 0 0 1-3.2 3.5M8 5H5v1.5A3.5 3.5 0 0 0 8.2 10"/><path d="M12 13v3.5M8.5 20.5h7M9.5 20.5l.8-4h3.4l.8 4"/></svg>
          <span class="mb-txt"><b data-t="home.achievements"></b></span>
          <em id="i-conquistas-selo" class="selo" hidden></em>
        </button>
        <button type="button" id="i-corredor" class="mb">
          <svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg>
          <span class="mb-txt"><b data-t="home.runner"></b></span>
        </button>
        <button type="button" id="i-recordes" class="mb">
          <svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20.5h16"/><path d="M7 20.5v-6M12 20.5v-14M17 20.5v-9.5"/></svg>
          <span class="mb-txt"><b data-t="home.records"></b></span>
        </button>
        <button type="button" id="i-opcoes" class="mb">
          <svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M18 6h2M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15.5" cy="6" r="2.2"/><circle cx="8.8" cy="12" r="2.2"/><circle cx="17" cy="18" r="2.2"/></svg>
          <span class="mb-txt"><b data-t="home.options"></b></span>
        </button>
      </nav>
    </div>
  </section>

  <!-- loja (GDD §42) -->
  <section id="tela-loja" class="tela modal meta" hidden>
    <div class="caixa larga">
      <header class="cab">
        <h1 class="tit">🛍️ <span data-t="shop.title"></span></h1>
        <span class="moedas pilula"><i class="moeda"></i><b id="loja-moedas">0</b></span>
        <button type="button" class="x fechar" data-t-aria="ui.close">✕</button>
      </header>
      <nav id="loja-abas" class="abas"></nav>
      <div id="loja-lista" class="rolagem grade-itens"></div>
    </div>
  </section>

  <!-- detalhe do item: comparar e comprar -->
  <section id="tela-item" class="tela modal topo" hidden>
    <div class="caixa item-caixa">
      <button type="button" class="x fechar" data-t-aria="ui.close">✕</button>
      <div id="item-corpo" class="item-corpo"></div>
    </div>
  </section>

  <!-- equipar: o corredor aparece ao lado e muda na hora -->
  <section id="tela-equipar" class="tela painel-lateral equipar" hidden>
    <div class="painel">
      <header class="cab">
        <h1 class="tit" data-t="equip.title"></h1>
        <button type="button" class="x fechar" data-t-aria="ui.close">✕</button>
      </header>
      <p class="nota" data-t="equip.hint"></p>
      <div id="eq-total" class="eq-total"></div>
      <div id="eq-slots" class="eq-slots"></div>
    </div>
  </section>

  <!-- conquistas (GDD §50–52) -->
  <section id="tela-conquistas" class="tela modal meta" hidden>
    <div class="caixa larga">
      <header class="cab">
        <h1 class="tit" data-t="ach.title"></h1>
        <span id="cq-conta" class="pilula"></span>
        <button type="button" class="x fechar" data-t-aria="ui.close">✕</button>
      </header>
      <nav id="cq-abas" class="abas"></nav>
      <div id="cq-lista" class="rolagem"></div>
    </div>
  </section>

  <!-- missões do dia (GDD §56) -->
  <section id="tela-missoes" class="tela modal meta" hidden>
    <div class="caixa">
      <header class="cab">
        <h1 class="tit" data-t="mis.title"></h1>
        <button type="button" class="x fechar" data-t-aria="ui.close">✕</button>
      </header>
      <p id="ms-reset" class="nota"></p>
      <div id="ms-lista" class="rolagem"></div>
    </div>
  </section>

  <!-- avisos: progresso offline, nível, conquista, região, presente -->
  <section id="tela-aviso" class="tela modal topo" hidden>
    <div id="av-caixa" class="caixa aviso-caixa"></div>
  </section>

  <!-- pausa -->
  <section id="tela-pausa" class="tela modal" hidden>
    <div class="caixa">
      <h1 class="tit" data-t="pause.title"></h1>
      <button type="button" id="p-continuar" class="btn pri largo" data-t="pause.resume"></button>
      <button type="button" id="p-opcoes" class="btn sec largo" data-t="pause.options"></button>
      <button type="button" id="p-encerrar" class="btn sec largo" data-t="pause.finish"></button>
      <p class="nota" data-t="pause.hint"></p>
    </div>
  </section>

  <!-- resumo da corrida -->
  <section id="tela-resumo" class="tela modal" hidden>
    <div class="caixa">
      <h1 class="tit" id="r-tit" data-t="sum.title"></h1>
      <div class="destaque"><b id="r-dist"></b><span id="r-tempo"></span></div>
      <dl id="r-lista" class="lista"></dl>
      <div class="ganho"><span data-t="sum.coins"></span><b id="r-moedas"></b></div>
      <div id="r-meta" class="r-meta"></div>
      <p id="r-total" class="nota"></p>
      <button type="button" id="r-continuar" class="btn pri largo" data-t="ui.continue"></button>
    </div>
  </section>

  <!-- recordes (GDD §53–54) -->
  <section id="tela-recordes" class="tela modal" hidden>
    <div class="caixa">
      <h1 class="tit" data-t="rec.title"></h1>
      <div id="rec-nome" class="nome"></div>
      <h2 data-t="rec.profile"></h2>
      <dl id="rec-perfil" class="lista"></dl>
      <h2 data-t="rec.best"></h2>
      <dl id="rec-melhores" class="lista"></dl>
      <button type="button" class="btn pri largo fechar" data-t="ui.close"></button>
    </div>
  </section>

  <!-- opções (GDD §71) -->
  <section id="tela-opcoes" class="tela modal" hidden>
    <div class="caixa">
      <h1 class="tit" data-t="opt.title"></h1>
      <div class="grupo"><span class="rot" data-t="opt.lang"></span><div class="chips" id="o-idioma"></div></div>
      <label class="alternar"><span data-t="opt.music"></span><input type="checkbox" id="o-musica"><i></i></label>
      <label class="alternar"><span data-t="opt.sfx"></span><input type="checkbox" id="o-efeitos"><i></i></label>
      <label class="alternar"><span data-t="opt.vibration"></span><input type="checkbox" id="o-vibracao"><i></i></label>
      <label class="alternar"><span data-t="opt.reduceMotion"></span><input type="checkbox" id="o-movimento"><i></i></label>
      <label class="alternar"><span data-t="opt.bigUi"></span><input type="checkbox" id="o-grande"><i></i></label>
      <div class="grupo"><span class="rot" data-t="opt.quality"></span><div class="chips" id="o-qualidade"></div><p class="nota" data-t="opt.qualityNote"></p></div>
      <div class="grupo"><span class="rot" data-t="opt.controls"></span><p class="nota" data-t="opt.controlsText"></p></div>
      <button type="button" class="btn pri largo fechar" data-t="ui.close"></button>
      <button type="button" id="o-apagar" class="btn perigo largo" data-t="opt.reset"></button>
      <p class="nota rodape"><span id="o-versao"></span> · <a href="../../privacidade.html" data-t="opt.privacy"></a></p>
    </div>
  </section>

  <!-- confirmação -->
  <section id="tela-confirmar" class="tela modal topo" hidden>
    <div class="caixa">
      <p id="cf-texto"></p>
      <div class="acoes">
        <button type="button" id="cf-nao" class="btn sec" data-t="ui.cancel"></button>
        <button type="button" id="cf-sim" class="btn perigo" data-t="ui.confirm"></button>
      </div>
    </div>
  </section>
</div>

<!-- motor 3D -->
<script src="vendor/three-0.128.0.min.js"></script>
<!-- núcleo -->
<script src="js/core/EP.js"></script>

<script src="dados/balanceamento.js"></script>
<script src="dados/aparencia.js"></script>
<script src="dados/npcs.js"></script>
<script src="dados/biomas.js"></script>

<script src="dados/biomas/europeu.js"></script>
<script src="dados/biomas/japones.js"></script>
<script src="dados/biomas/deserto.js"></script>
<script src="dados/biomas/alpino.js"></script>
<script src="dados/biomas/nordico.js"></script>
<script src="dados/economia.js"></script>
<script src="dados/itens.js"></script>

<script src="dados/modelos/corredor-m.js"></script>
<script src="dados/modelos/corredor-f.js"></script>
<script src="dados/modelos/roupas.js"></script>
<script src="dados/modelos/cabelos.js"></script>
<script src="dados/textos/pt-BR.js"></script>
<script src="dados/textos/en-US.js"></script>
<script src="dados/textos/es.js"></script>

<script src="js/core/SaveManager.js"></script>
<script src="js/core/LocalizationManager.js"></script>
<script src="js/core/Analytics.js"></script>
<script src="js/systems/TapRhythmSystem.js"></script>
<script src="js/systems/FlowSystem.js"></script>
<script src="js/systems/EnergySystem.js"></script>
<script src="js/systems/SpeedSystem.js"></script>
