<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prévia do corredor assado</title>
<style>
  html, body { margin: 0; background: #c9d2dc; font: 13px system-ui, sans-serif; color: #223; }
  #ui { position: fixed; left: 8px; top: 8px; background: rgba(255,255,255,0.85); padding: 6px 8px; border-radius: 6px; z-index: 2; }
  #ui select, #ui button { font: inherit; margin: 2px; }
  canvas { display: block; }
  .lab { position: absolute; font: 600 12px system-ui; color: #223; background: rgba(255,255,255,0.7); padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<!-- Prévia isolada dos dados de ferramentas/bake-corredor.mjs: SkinnedMesh com os ossos do jogo (14 + cabelo),
     pose de repouso e poses de corrida copiadas do RunnerRig. O Playwright chama window.render(spec). -->
<div id="ui"></div>
<script src="../jogar/vendor/three-0.128.0.min.js"></script>
<script src="../jogar/js/core/EP.js"></script>
<script src="../jogar/dados/aparencia.js"></script>
<script src="../jogar/dados/modelos/corredor-m.js"></script>
<script src="../jogar/dados/modelos/corredor-f.js"></script>
<script src="../jogar/dados/modelos/roupas.js" onerror="void 0"></script>
<script src="../jogar/dados/modelos/cabelos.js" onerror="void 0"></script>
<script src="../jogar/js/runner/ModelData.js"></script>
<script>
(function () {
  'use strict';
  var MD = EP.ModelData, U = EP.util, A = EP.data.appearance;
  var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.setPixelRatio(1);
  renderer.autoClear = false;
  document.body.appendChild(renderer.domElement);

  // ---------------------------------------------------------------- material do corredor (cópia simplificada de Materials.js)
  var mats = {};
  function material(g, opts) {
    var key = g + '|' + (opts.normal ? 1 : 0) + '|' + (opts.flat ? 1 : 0) + '|' + (opts.noTex ? 1 : 0);
    if (mats[key]) return mats[key];
    var m = new THREE.MeshPhongMaterial({ vertexColors: true, skinning: true, specular: new THREE.Color(0x262626), shininess: 22,
      map: opts.noTex ? null : MD.texture(g, 'skin'), color: opts.noTex ? new THREE.Color(1, 1, 1) : new THREE.Color(2, 2, 2) });
    if (opts.normal && MD.texture(g, 'normal')) { m.normalMap = MD.texture(g, 'normal'); m.normalScale = new THREE.Vector2(0.8, 0.8); }
    m.onBeforeCompile = function (shader) {
      shader.vertexShader = 'attribute float mat;\nvarying float vMat;\nvarying vec3 vRest;\n' + shader.vertexShader.replace('#include <begin_vertex>',
        '#include <begin_vertex>\nvMat = mat;\nvRest = position;');
      shader.fragmentShader = 'varying float vMat;\nvarying vec3 vRest;\n' + shader.fragmentShader
        .replace('#include <color_fragment>', [
          '#include <color_fragment>',
          'float rm = floor( vMat + 0.5 );',
          'if ( rm > 2.5 && rm < 3.5 ) {',
          '  float ang = atan( vRest.x, vRest.z - 0.02 );',
          '  diffuseColor.rgb *= 0.86 + 0.22 * pow( abs( sin( ang * 46.0 + vRest.y * 24.0 + sin( ang * 7.0 ) * 2.0 ) ), 3.0 );',
          '} else if ( rm > 0.5 && rm < 2.5 ) {',
          '  diffuseColor.rgb *= 0.965 + 0.035 * sin( vRest.y * 700.0 ) * sin( ( vRest.x + vRest.z ) * 700.0 );',
          '}'
        ].join('\n'))
        .replace('#include <lights_phong_fragment>', [
          '#include <lights_phong_fragment>',
          'if ( rm < 0.5 ) { material.specularStrength = 0.55; material.specularShininess = 14.0; }',
          'else if ( rm < 1.5 ) { material.specularStrength = 0.05; material.specularShininess = 4.0; }',
          'else if ( rm < 2.5 ) { material.specularStrength = 0.7; material.specularShininess = 22.0; }',
          'else if ( rm < 3.5 ) { material.specularStrength = 1.1; material.specularShininess = 36.0; }',
          'else if ( rm < 4.5 ) { material.specularStrength = 0.5; material.specularShininess = 20.0; }',
          'else { material.specularStrength = 2.5; material.specularShininess = 90.0; }'
        ].join('\n'))
        .replace('#include <aomap_fragment>', [
          '#include <aomap_fragment>',
          'if ( rm < 0.5 ) reflectedLight.indirectDiffuse += diffuseColor.rgb * vec3( 0.09, 0.03, 0.015 );',
          'if ( rm > 0.5 && rm < 2.5 ) {',
          '  float sh = pow( 1.0 - max( dot( normalize( vViewPosition ), normal ), 0.0 ), 2.0 );',
          '  reflectedLight.indirectDiffuse += diffuseColor.rgb * sh * 0.22;',
          '}'
        ].join('\n'));
    };
    m.customProgramCacheKey = function () { return 'prev' + key; };
    return (mats[key] = m);
  }

  // ---------------------------------------------------------------- cores (mesma lógica do RunnerRig)
  function lin(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }
  function palette(o) {
    var W = new THREE.Color(1, 1, 1), p = {};
    p.skin = lin(o.skin || A.skin[1]);
    p.hair = lin(o.hairColor || A.hairColors[1]);
    p.brow = p.hair.clone().multiplyScalar(0.8).lerp(p.skin, 0.2);
    p.lash = lin('#2a1d18');
    p.eye = new THREE.Color(1, 1, 1);
    p.hairTie = lin(o.tie || '#222222');
    p.shirt = lin(o.shirt || '#ff6a3d'); p.shirtTrim = p.shirt.clone().multiplyScalar(0.78); p.shirtAccent = p.shirt.clone().lerp(W, 0.7);
    p.shorts = lin(o.shorts || '#22283a'); p.shortsTrim = p.shorts.clone().multiplyScalar(0.72); p.shortsAccent = p.shorts.clone().lerp(W, 0.35);
    if (o.shirtAccent) { p.shirtTrim = lin(o.shirtAccent); p.shirtAccent = lin(o.shirtAccent); }
    if (o.shortsAccent) { p.shortsAccent = lin(o.shortsAccent); p.shortsTrim = lin(o.shortsAccent); }
    p.sock = lin('#f3f2ee'); p.sockTrim = p.sock.clone().multiplyScalar(0.8);
    p.shoe = lin(o.shoes || '#f4f4f4'); p.shoeAccent = o.shoeAccent ? lin(o.shoeAccent) : p.shoe.clone().lerp(W, 0.6);
    p.sole = lin('#4a4a50'); p.midsole = lin(o.midsole || '#f6f5f0'); p.lace = p.shoe.clone().lerp(W, 0.75); p.lining = lin('#3a3a40');
    return p;
  }
  function paint(mesh, g, o) {
    var c = MD.char(g), pal = palette(o), cols = c.slots.map(function (s) { return pal[s] || new THREE.Color(1, 0, 1); });
    var n = mesh.n, col = new Float32Array(n * 3);
    for (var i = 0; i < n; i++) {
      var cc = cols[mesh.slot[i]], k = mesh.ao[i];
      if (o.debugCover && mesh.mat[i] === 0) cc = new THREE.Color(1, 0, 1);
      col[i * 3] = cc.r * k; col[i * 3 + 1] = cc.g * k; col[i * 3 + 2] = cc.b * k;
    }
    return col;
  }

  // ---------------------------------------------------------------- corredor
  function Runner(item) {
    var g = item.g, c = MD.char(g), self = this;
    this.c = c; this.g = g;
    this.root = new THREE.Group();
    this.bones = []; this.by = {};
    c.bones.names.forEach(function (name, i) {
      var b = new THREE.Bone(); b.name = name; b.position.fromArray(c.bones.pos[i]);
      self.bones.push(b); self.by[name] = b;
      var p = c.bones.parent[i];
      if (p >= 0) self.bones[p].add(b); else self.root.add(b);
    });
    var outfit = item.outfit || {};
    var mesh = MD.assemble(g, outfit, item.lod || 0);
    this.data = mesh;
    var geo = MD.geometry(mesh);
    geo.setAttribute('color', new THREE.BufferAttribute(paint(mesh, g, item), 3));
    var skel = new THREE.Skeleton(this.bones);
    this.mesh = new THREE.SkinnedMesh(geo, material(g, { normal: item.normal !== false, noTex: !!item.noTex }));
    this.mesh.frustumCulled = false;
    this.root.add(this.mesh);
    this.root.updateMatrixWorld(true);
    this.mesh.bind(skel);
    this.hipY = c.bones.pos[0][1];
    this.root.scale.setScalar(item.real ? c.heightReal / 1.76 : 1);
    this.tris = mesh.index.length / 3;
  }
  // pose de corrida (cópia da matemática de RunnerRig.animate, com HIP_H = quadril de repouso)
  var STRIDE = [[0, 0.85], [4, 0.9], [6, 1.0], [8, 1.3], [12, 1.43], [16, 1.55], [21, 1.68]];
  Runner.prototype.run = function (ph, speed) {
    var B = this.by, run = U.smooth((speed - 5.8) / 2.6), sprint = U.smooth((speed - 14) / 5), freq = U.table(STRIDE, speed);
    var s = Math.sin(ph), c = Math.cos(ph), omega = Math.PI * 2 * freq, A2 = U.clamp(speed / 3.6 / (0.88 * omega), 0.26, 0.62) * (1 + run * 0.18);
    var legs = [[B.legL, B.kneeL, B.footL, 0], [B.legR, B.kneeR, B.footR, Math.PI]];
    for (var i = 0; i < 2; i++) {
      var L = legs[i], p = ph + L[3], ls = Math.sin(p), lc = Math.cos(p), swing = Math.max(0, lc);
      var hip = A2 * ls + run * 0.1 + swing * run * 0.12 * ls;
      var kneeSwing = U.lerp(0.45, 1.75, run) + sprint * 0.25;
      var knee = -(U.lerp(0.06, 0.22, run) * Math.max(0, -lc) * (0.6 + 0.4 * Math.max(0, ls)) + kneeSwing * Math.pow(Math.max(0, Math.sin(p + 0.55 + run * 0.25)), 1.6) * (0.35 + 0.65 * swing));
      var stance = Math.max(0, -lc);
      var abs = 0.22 * Math.max(0, ls) * (1 - run * 0.5) - 0.65 * stance * Math.max(0, -ls) * (0.5 + run * 0.5) + swing * 0.12;
      L[0].rotation.set(hip, 0, (i ? -1 : 1) * 0.015);
      L[1].rotation.x = knee;
      L[2].rotation.x = abs - hip - knee;
    }
    var aa = U.lerp(0.26, 0.55, run) + sprint * 0.2, elbow = U.lerp(0.3, 1.5, run) + sprint * 0.12;
    B.armL.rotation.set(-aa * s - 0.04 * run, 0, -0.07 - run * 0.03);
    B.armR.rotation.set(aa * s - 0.04 * run, 0, 0.07 + run * 0.03);
    B.elbowL.rotation.set(elbow + 0.2 * Math.max(0, s) * run, 0, 0.16 * run);
    B.elbowR.rotation.set(elbow + 0.2 * Math.max(0, -s) * run, 0, -0.16 * run);
    var bob = Math.abs(Math.cos(ph - 0.35));
    B.hips.position.y = this.hipY - run * 0.035 - U.lerp(0.012, 0.045, run) * (bob - 0.5) - 0.012 * (1 - run);
    B.hips.rotation.set(0, -0.08 * s, 0.035 * c * (1 - run * 0.4));
    var lean = U.lerp(0.035, 0.11, run) + sprint * 0.06;
    B.torso.rotation.set(-lean, 0.14 * s * (0.6 + run * 0.4), -0.02 * c);
    B.head.rotation.set(lean * 0.7 + 0.02 * (bob - 0.5) * run, -0.1 * s * (0.6 + run * 0.4), 0.02 * c);
    // molas do cabelo: aproximação estática (ângulo de equilíbrio)
    var tx = 0.15 + run * 0.45 + (bob - 0.5) * 0.35 * run, tz = -s * 0.25 * (0.3 + run * 0.7);
    if (B.pony) { B.pony.rotation.set(tx, 0, tz); B.pony2.rotation.set(tx * 0.6, 0, tz * 0.6); }
    if (B.hairA) { B.hairA.rotation.set(U.clamp(tx * 0.8, -0.25, 0.6), 0, tz * 0.5); B.hairA2.rotation.set(U.clamp(tx * 0.5, -0.25, 0.6), 0, tz * 0.3); }
  };
  Runner.prototype.pose = function (p) {
    var B = this.by;
    if (p.name === 'test') {   // teste do contrato: braços balançando, joelho dobrado
      B.armL.rotation.set(0.7, 0, 0); B.armR.rotation.set(-0.5, 0, 0);
      B.elbowL.rotation.set(1.2, 0, 0); B.elbowR.rotation.set(0.6, 0, 0);
      B.legL.rotation.set(0.6, 0, 0); B.kneeL.rotation.x = -1.2; B.footL.rotation.x = 0.3;
      B.legR.rotation.set(-0.3, 0, 0); B.kneeR.rotation.x = -0.3;
      B.torso.rotation.set(-0.1, 0.15, 0); B.head.rotation.set(0.1, -0.1, 0);
      if (B.pony) { B.pony.rotation.set(0.5, 0, 0.2); B.pony2.rotation.set(0.4, 0, 0.1); }
      if (B.hairA) { B.hairA.rotation.set(0.4, 0, 0); B.hairA2.rotation.set(0.3, 0, 0); }
    } else if (p.name === 'run') this.run(p.phase || 0, p.speed || 10);
    else if (p.name === 'celebrate') {
      B.armL.rotation.set(Math.PI * 0.95, 0, -0.3); B.armR.rotation.set(Math.PI * 0.95, 0, 0.3);
      B.elbowL.rotation.set(0.3, 0, 0); B.elbowR.rotation.set(0.3, 0, 0);
    }
  };

  var VIEWS = { front: [0, 0], back: [Math.PI, 0], side: [-Math.PI / 2, 0], sideR: [Math.PI / 2, 0], '34': [-0.6, 0.05], '34b': [-2.4, 0.05], top: [0, 1.2], below: [0, -0.5] };
  var labels = [];
  window.render = function (spec) {
    labels.forEach(function (l) { l.remove(); }); labels = [];
    var W = spec.w || 1200, H = spec.h || 800, cols = spec.cols || spec.items.length, rows = Math.ceil(spec.items.length / cols);
    renderer.setSize(W, H);
    renderer.setScissorTest(false);
    renderer.setClearColor(spec.bg || '#c9d2dc'); renderer.clear();
    renderer.setScissorTest(true);
    var tw = W / cols, th = H / rows, info = [];
    spec.items.forEach(function (it, k) {
      var r = new Runner(it);
      if (it.pose) r.pose(it.pose);
      var scene = new THREE.Scene();
      scene.add(r.root);
      var hemi = new THREE.HemisphereLight(0xdfe8f5, 0x5a5048, 0.75); scene.add(hemi);
      var key = new THREE.DirectionalLight(0xfff2e0, 1.6); key.position.set(0.5, 1, -0.8); scene.add(key);
      var fill = new THREE.DirectionalLight(0xc8d8ff, 0.35); fill.position.set(-0.8, 0.4, 0.6); scene.add(fill);
      if (it.light === 'top') { key.position.set(0, 1, -0.05); fill.intensity = 0; hemi.intensity = 0.3; }
      var v = VIEWS[it.view || 'front'] || VIEWS.front, tgt = it.target || [0, 0.9, 0], dist = it.dist || 3.2;
      var cam;
      if (it.ortho) {
        var hh = it.ortho / 2, asp = tw / th;
        cam = new THREE.OrthographicCamera(-hh * asp, hh * asp, hh, -hh, 0.01, 50);
      } else cam = new THREE.PerspectiveCamera(it.fov || 30, tw / th, 0.01, 60);
      // frente do corredor = -z: câmera "front" fica em -z olhando para +z
      cam.position.set(tgt[0] + Math.sin(v[0]) * Math.cos(v[1]) * dist, tgt[1] + Math.sin(v[1]) * dist, tgt[2] - Math.cos(v[0]) * Math.cos(v[1]) * dist);
      cam.lookAt(tgt[0], tgt[1], tgt[2]);
      var col = k % cols, row = Math.floor(k / cols), x = col * tw, y = H - (row + 1) * th;
      renderer.setViewport(x, y, tw, th); renderer.setScissor(x, y, tw, th);
      if (it.bg) { renderer.setClearColor(it.bg); renderer.clear(); }
      renderer.render(scene, cam);
      if (it.label) {
        var d = document.createElement('div'); d.className = 'lab'; d.textContent = it.label;
        d.style.left = (x + 4) + 'px'; d.style.top = (row * th + 4) + 'px'; document.body.appendChild(d); labels.push(d);
      }
      info.push({ tris: r.tris, n: r.data.n, key: r.data.key });
      r.mesh.geometry.dispose();
    });
    return info;
  };
  window.texReady = function () {
    var ok = true;
    ['m', 'f'].forEach(function (g) { ['skin', 'normal'].forEach(function (k) { var t = MD.texture(g, k); if (t && !(t.image && t.image.complete)) ok = false; }); });
    return ok;
  };
  // interface manual mínima
  var ui = document.getElementById('ui');
  ui.style.display = /driver/.test(location.search) ? 'none' : '';
  ui.innerHTML = 'ver: <button id="b1">m+f repouso</button><button id="b2">corrida</button>';
  document.getElementById('b1').onclick = function () {
    render({ w: innerWidth, h: innerHeight, items: [{ g: 'm', view: 'front' }, { g: 'm', view: 'side' }, { g: 'f', view: 'front' }, { g: 'f', view: '34' }] });
  };
  document.getElementById('b2').onclick = function () {
    render({ w: innerWidth, h: innerHeight, items: [0, 1, 2, 3].map(function (i) { return { g: i % 2 ? 'f' : 'm', view: 'side', pose: { name: 'run', phase: i * 1.6, speed: 12 } }; }) });
  };
  if (!/[?&]driver/.test(location.search)) window.addEventListener('load', function () { setTimeout(function () { document.getElementById('b1').onclick(); }, 300); });
})();
</script>
</body>
</html>
