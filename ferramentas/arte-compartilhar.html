<!doctype html><html><head><meta charset="utf-8">
<!-- Arte de img/compartilhar-site.jpg (a imagem do link do site). Para refazer: abra
     esta página numa janela de 1200×630, tire um print e salve como JPEG (até 300 KB).
     Jogo novo: acrescente um <div class="c"> com a capa e ajuste as posições. -->
<link rel="stylesheet" href="../fontes/fontes.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{position:relative;font-family:"Exo 2",sans-serif;color:#e9ebf8;
    background:radial-gradient(ellipse 70% 60% at 10% 0%,rgba(160,107,255,.35),transparent 70%),
               radial-gradient(ellipse 60% 70% at 100% 100%,rgba(46,230,255,.16),transparent 70%),#07081c}
  .grade{position:absolute;left:0;right:0;bottom:0;height:200px;opacity:.35;
    background-image:linear-gradient(rgba(160,120,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(160,120,255,.35) 1px,transparent 1px);
    background-size:48px 48px;transform:perspective(400px) rotateX(60deg);transform-origin:bottom;
    -webkit-mask-image:linear-gradient(transparent,#000 70%)}
  .esq{position:absolute;left:70px;top:70px;width:470px}
  .topo{display:flex;align-items:center;gap:18px}
  .topo img{width:92px;height:92px;border-radius:20px;box-shadow:0 0 0 2px rgba(46,230,255,.5),0 10px 30px rgba(0,0,0,.5)}
  .games{padding:6px 12px;border:2px solid #2ee6ff;border-radius:8px;color:#2ee6ff;font:700 17px "Chakra Petch";letter-spacing:.22em;box-shadow:0 0 14px rgba(46,230,255,.35)}
  h1{margin:30px 0 0;font:700 84px/0.98 "Chakra Petch";letter-spacing:.01em;text-transform:uppercase;
    background:linear-gradient(180deg,#fff 0%,#cfe9ff 60%,#8fd8ff 100%);-webkit-background-clip:text;color:transparent}
  h1 .z{background:linear-gradient(180deg,#fff2c4,#ffc43d);-webkit-background-clip:text;color:transparent}
  p{margin:26px 0 0;font:400 25px/1.45 "Exo 2";color:#b4bbe0}
  .btn{display:inline-flex;align-items:center;gap:12px;margin-top:30px;padding:14px 34px;border-radius:16px;font:700 27px "Chakra Petch";letter-spacing:.12em;color:#2a1500;
    background:linear-gradient(180deg,#fff2c4 0%,#ffd45e 40%,#ff9f2e 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 5px 0 #8a4a0e,0 0 30px rgba(255,170,60,.45)}
  .c{position:absolute;aspect-ratio:1200/630;border-radius:16px;overflow:hidden;background:#000;
    box-shadow:0 0 0 2px rgba(140,160,255,.35),0 18px 40px rgba(0,0,0,.6)}
  .c img{width:100%;height:100%;object-fit:cover;display:block}
  .c.sc img{object-fit:contain;background:#12161f}
  .c.hero{box-shadow:0 0 0 3px #ffd36b,0 0 40px rgba(255,190,80,.55),0 0 90px rgba(160,107,255,.5),0 24px 50px rgba(0,0,0,.7)}
  .novo{position:absolute;padding:6px 14px;border-radius:9px;background:linear-gradient(180deg,#ff5fd2,#a06bff);color:#fff;
    font:700 19px "Chakra Petch";letter-spacing:.16em;box-shadow:0 0 18px rgba(255,95,210,.6),0 4px 0 #4b1d8a}
</style></head><body>
<div class="grade"></div>
<div class="esq">
  <div class="topo"><img src="../img/logo.svg" alt=""><span class="games">GAMES</span></div>
  <h1>Xadrez<br>com <span class="z">Z</span></h1>
  <p>Jogos grátis direto no navegador.<br>No celular ou no computador.</p>
  <div class="btn">▶ JOGAR</div>
</div>
<div class="c" style="left:885px;top:22px;width:300px;transform:rotate(5deg)"><img src="../img/capa-rock-orbit.webp"></div>
<div class="c sc" style="left:610px;top:52px;width:290px;transform:rotate(-6deg)"><img src="../img/capa-slide-chess.webp"></div>
<div class="c" style="left:885px;top:462px;width:290px;transform:rotate(-4deg)"><img src="../img/capa-rules.webp"></div>
<div class="c" style="left:968px;top:232px;width:226px;transform:rotate(6deg)"><img src="../img/capa-imobiliario.webp"></div>
<div class="c hero" style="left:566px;top:214px;width:420px;transform:rotate(-2.5deg)"><img src="../img/capa-hero-ultimate.webp"></div>
<div class="novo" style="left:576px;top:190px;transform:rotate(-6deg)">NOVO</div>
</body></html>
